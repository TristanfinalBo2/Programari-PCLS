<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cererile Mele | Portal PCLS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #05070c;
            --glass: rgba(18, 25, 40, 0.48);
            --glass-strong: rgba(22, 31, 49, 0.68);
            --line: rgba(255, 255, 255, 0.11);
            --text: #f7f9ff;
            --muted: #b8c0d0;
            --quiet: #7f8aa0;
            --accent: #64d2ff;
            --accent-2: #0a84ff;
            --mint: #63e6be;
            --gold: #ffd60a;
            --danger: #ff6961;
            --radius: 24px;
            --blur: blur(28px) saturate(155%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header-container {
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--muted);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .btn-back {
            padding: 10px 18px;
            background: var(--glass);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            backdrop-filter: var(--blur);
        }

        .btn-back:hover {
            background: var(--glass-strong);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .requests-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .request-card {
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: var(--blur);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .request-card:hover {
            border-color: rgba(100, 210, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 10px;
        }

        .dept-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            background: rgba(100, 210, 255, 0.12);
            color: var(--accent);
            border: 1px solid rgba(100, 210, 255, 0.25);
            border-radius: 20px;
        }

        .status-badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .status-pending {
            background: rgba(255, 214, 10, 0.15);
            color: var(--gold);
            border: 1px solid rgba(255, 214, 10, 0.3);
        }

        .status-approved {
            background: rgba(99, 230, 190, 0.15);
            color: var(--mint);
            border: 1px solid rgba(99, 230, 190, 0.3);
        }

        .status-rejected {
            background: rgba(255, 105, 97, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 105, 97, 0.3);
        }

        .card-details {
            font-size: 0.9rem;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .card-details strong {
            color: var(--text);
        }

        .btn-details {
            margin-top: 10px;
            width: 100%;
            padding: 10px 16px;
            background: rgba(100, 210, 255, 0.1);
            border: 1px solid rgba(100, 210, 255, 0.3);
            color: var(--accent);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-details:hover {
            background: rgba(100, 210, 255, 0.25);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .empty-state, .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        /* Stiluri Modal Pop-up */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #0d121d;
            border: 1px solid var(--line);
            border-radius: 20px;
            width: 90%;
            max-width: 520px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            color: var(--text);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            color: var(--text);
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .detail-row {
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .detail-row strong {
            color: var(--accent);
        }

        .status-box-info {
            margin-top: 16px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-title">
            <h1>Cererile Mele</h1>
            <p>Urmărește statusul și detaliile cererilor tale trimise</p>
        </div>
        <a href="index.html" class="btn-back">← Înapoi</a>
    </div>

    <div class="requests-container" id="requests-container">
        <div class="loading-state">Se încarcă cererile tale...</div>
    </div>

    <div id="details-modal-overlay" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title">Detalii Cerere</h3>
                <button id="modal-close-btn" class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body-content">
                </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let userRequestsCache = [];

        onAuthStateChanged(auth, async (user) => {
            const container = document.getElementById("requests-container");

            if (!user) {
                container.innerHTML = `<div class="empty-state">Trebuie să fii conectat pentru a-ți vedea cererile.</div>`;
                return;
            }

            try {
                // Interogăm cererile utilizatorului curent
                const q = query(
                    collection(db, "cereri"),
                    where("userId", "==", user.uid)
                );

                const querySnapshot = await getDocs(q);
                userRequestsCache = [];

                querySnapshot.forEach((doc) => {
                    userRequestsCache.push({ id: doc.id, ...doc.data() });
                });

                // Sortăm după dată (cele mai recente primele)
                userRequestsCache.sort((a, b) => {
                    const dateA = a.data?.seconds || a.createdAt?.seconds || 0;
                    const dateB = b.data?.seconds || b.createdAt?.seconds || 0;
                    return dateB - dateA;
                });

                if (userRequestsCache.length === 0) {
                    container.innerHTML = `<div class="empty-state">Nu ai nicio cerere înregistrată în acest moment.</div>`;
                    return;
                }

                container.innerHTML = userRequestsCache.map(req => {
                    const status = req.status || req.stare || "În așteptare";
                    let statusClass = "status-pending";
                    let statusLabel = status;

                    if (status.toLowerCase().includes("aprobat")) {
                        statusClass = "status-approved";
                        statusLabel = "Aprobat";
                    } else if (status.toLowerCase().includes("respins")) {
                        statusClass = "status-rejected";
                        statusLabel = "Respins";
                    } else if (status === "in_asteptare" || status.toLowerCase().includes("așteptare")) {
                        statusClass = "status-pending";
                        statusLabel = "În așteptare";
                    }

                    // Formatare dată și oră creării
                    let dataFormatata = "Recentă";
                    if (req.data && req.data.seconds) {
                        dataFormatata = new Date(req.data.seconds * 1000).toLocaleString('ro-RO', {
                            day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                    } else if (req.createdAt && req.createdAt.seconds) {
                        dataFormatata = new Date(req.createdAt.seconds * 1000).toLocaleString('ro-RO', {
                            day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                    } else if (req.data) {
                        dataFormatata = req.data;
                    }

                    const tipCerere = req.tipCerere || req.tip || req.titlu || 'Cerere Generală';

                    return `
                        <div class="request-card">
                            <div>
                                <div class="card-header">
                                    <span class="dept-badge">${tipCerere}</span>
                                    <span class="status-badge ${statusClass}">${statusLabel}</span>
                                </div>
                                <div class="card-details">
                                    <div><strong>Tip Cerere:</strong> ${tipCerere}</div>
                                    <div><strong>Nume titular / afacere:</strong> ${req.numeAfacere || req.nume || 'N/A'}</div>
                                    <div><strong>Data creării:</strong> ${dataFormatata}</div>
                                    <div><strong>ID Cerere:</strong> #${req.id.substring(0, 8)}</div>
                                </div>
                            </div>
                            <button class="btn-details" onclick="deschideDetaliiCerere('${req.id}')">
                                🔍 Mai multe detalii
                            </button>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Eroare încărcare cereri:", err);
                container.innerHTML = `<div class="empty-state">A apărut o eroare la încărcarea cererilor. Încearcă mai târziu.</div>`;
            }
        });

        // Funcția globală de deschidere modal
        window.deschideDetaliiCerere = function(id) {
            const req = userRequestsCache.find(r => r.id === id);
            if (!req) return;

            const modal = document.getElementById("details-modal-overlay");
            const content = document.getElementById("modal-body-content");
            const modalTitle = document.getElementById("modal-title");

            let dataFormatata = "Nespecificată";
            if (req.data && req.data.seconds) {
                dataFormatata = new Date(req.data.seconds * 1000).toLocaleString('ro-RO', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            } else if (req.createdAt && req.createdAt.seconds) {
                dataFormatata = new Date(req.createdAt.seconds * 1000).toLocaleString('ro-RO', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            } else if (req.data) {
                dataFormatata = req.data;
            }

            const status = req.status || req.stare || "În așteptare";
            let statusText = "În așteptare";
            let statusColor = "#ffd60a";

            if (status.toLowerCase().includes("aprobat")) {
                statusText = "Aprobat ✓";
                statusColor = "#63e6be";
            } else if (status.toLowerCase().includes("respins")) {
                statusText = "Respins ✕";
                statusColor = "#ff6961";
            }

            const procesatDe = req.procesatDe || req.aprobatDe || req.respinsDe || req.verificatDe || req.adminName || req.admin || "În așteptare (Niciun administrator încă)";
            const motiv = req.motivRespingere || req.motiv || req.observatii || req.notaAdmin || null;
            const tipCerere = req.tipCerere || req.tip || req.titlu || 'Cerere Generală';

            if (modalTitle) modalTitle.textContent = `Detalii Cerere - #${req.id.substring(0, 8)}`;

            content.innerHTML = `
                <div class="detail-row"><strong>Tip Cerere:</strong> ${tipCerere}</div>
                <div class="detail-row"><strong>Nume Titular / Afacere:</strong> ${req.numeAfacere || req.nume || 'N/A'}</div>
                <div class="detail-row"><strong>Data Creării:</strong> ${dataFormatata}</div>
                <div class="detail-row"><strong>Discord ID:</strong> ${req.discordId || req.discord || 'N/A'}</div>
                <div class="detail-row"><strong>ID complet cerere:</strong> ${req.id}</div>
                
                ${req.descriere ? `<div class="detail-row"><strong>Descriere / Detalii:</strong> ${req.descriere}</div>` : ''}
                ${req.telefon ? `<div class="detail-row"><strong>Telefon:</strong> ${req.telefon}</div>` : ''}
                ${req.locatie ? `<div class="detail-row"><strong>Locație:</strong> ${req.locatie}</div>` : ''}

                <div class="status-box-info">
                    <div class="detail-row">
                        <strong>Status Cerere:</strong> 
                        <span style="color: ${statusColor}; font-weight: bold;">${statusText}</span>
                    </div>
                    <div class="detail-row">
                        <strong>Procesat / Decis de:</strong> 
                        <span style="color: var(--text); font-weight: 500;">${procesatDe}</span>
                    </div>
                    ${motiv ? `
                    <div class="detail-row" style="margin-top: 8px;">
                        <strong>Motiv / Observații admin:</strong> 
                        <span style="color: var(--muted);">${motiv}</span>
                    </div>` : ''}
                </div>
            `;

            modal.classList.add("show");
        };

        // Ascultători pentru închiderea modalului
        document.addEventListener("DOMContentLoaded", () => {
            const modal = document.getElementById("details-modal-overlay");
            const closeBtn = document.getElementById("modal-close-btn");

            if (closeBtn) {
                closeBtn.addEventListener("click", () => {
                    modal.classList.remove("show");
                });
            }

            if (modal) {
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) {
                        modal.classList.remove("show");
                    }
                });
            }
        });
    </script>
</body>
</html>

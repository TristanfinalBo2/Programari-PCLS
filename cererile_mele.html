<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cererile Mele | Portal PCLS</title>
    <style>
:root {
    color-scheme: dark;
    --bg: #05070c;
    --glass: rgba(18, 25, 40, 0.48);
    --glass-strong: rgba(22, 31, 49, 0.68);
    --line: rgba(255, 255, 255, 0.11);
    --text: #f7f9ff;
    --muted: #b8c0d0;
    --quiet: #7f8aa0;
    --accent: #64d2ff;
    --accent-2: #0a84ff;
    --mint: #63e6be;
    --gold: #ffd60a;
    --danger: #ff6961;
    --radius: 24px;
    --blur: blur(28px) saturate(155%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
}

.header-container {
    width: 100%;
    max-width: 900px;
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-title h1 {
    font-size: 2rem;
    font-weight: 700;
}

.header-title p {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 4px;
}

.btn-back {
    padding: 10px 18px;
    background: var(--glass);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.9rem;
    transition: all 0.25s ease;
}

.btn-back:hover {
    background: var(--glass-strong);
    border-color: var(--accent);
}

.requests-container {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.request-card {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    backdrop-filter: var(--blur);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.dept-badge {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 4px 10px;
    background: rgba(100, 210, 255, 0.1);
    color: var(--accent);
    border-radius: 12px;
}

.status-badge {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 12px;
}

.status-pending { background: rgba(255, 214, 10, 0.15); color: var(--gold); }
.status-approved { background: rgba(99, 230, 190, 0.15); color: var(--mint); }
.status-rejected { background: rgba(255, 105, 97, 0.15); color: var(--danger); }

.card-details {
    font-size: 0.9rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
}

.card-details strong { color: var(--text); }

.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: var(--muted);
}

/* Stil Buton Detalii (respectă designul existent) */
.btn-details {
    width: 100%;
    padding: 10px;
    background: rgba(100, 210, 255, 0.1);
    border: 1px solid rgba(100, 210, 255, 0.25);
    color: var(--accent);
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-details:hover {
    background: rgba(100, 210, 255, 0.2);
    border-color: var(--accent);
}

/* Stil Modal Detalii (folosește aceleași variabile din design) */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: var(--blur);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.25s ease;
}

.modal-overlay.show {
    opacity: 1;
    visibility: visible;
}

.modal-container {
    background: var(--glass-strong);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    width: 90%;
    max-width: 480px;
    padding: 24px;
    color: var(--text);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 16px;
}

.modal-header h3 {
    font-size: 1.1rem;
    color: var(--text);
}

.modal-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.5rem;
    cursor: pointer;
}

.detail-row {
    margin-bottom: 10px;
    font-size: 0.9rem;
    color: var(--muted);
}

.detail-row strong {
    color: var(--text);
}

.status-box {
    margin-top: 14px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
}
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-title">
            <h1>Cererile Mele</h1>
            <p>Urmărește statusul cererilor tale trimise</p>
        </div>
        <a href="index.html" class="btn-back">← Înapoi</a>
    </div>

    <div class="requests-container" id="requests-container">
        <div class="empty-state">Se încarcă cererile...</div>
    </div>

    <div id="details-modal-overlay" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title">Detalii Cerere</h3>
                <button id="modal-close-btn" class="modal-close">&times;</button>
            </div>
            <div id="modal-body-content">
                </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let userRequestsCache = [];

        onAuthStateChanged(auth, async (user) => {
            const container = document.getElementById("requests-container");

            if (!user) {
                container.innerHTML = `<div class="empty-state">Trebuie să fii conectat pentru a-ți vedea cererile.</div>`;
                return;
            }

            try {
                const q = query(
                    collection(db, "cereri"),
                    where("userId", "==", user.uid)
                );

                const querySnapshot = await getDocs(q);
                userRequestsCache = [];

                querySnapshot.forEach((doc) => {
                    userRequestsCache.push({ id: doc.id, ...doc.data() });
                });

                if (userRequestsCache.length === 0) {
                    container.innerHTML = `<div class="empty-state">Nu ai nicio cerere înregistrată.</div>`;
                    return;
                }

                container.innerHTML = userRequestsCache.map(req => {
                    const status = req.status || req.stare || "În așteptare";
                    let statusClass = "status-pending";
                    let statusText = status === "in_asteptare" ? "În așteptare" : status;

                    if (status.toLowerCase().includes("aprobat")) statusClass = "status-approved";
                    if (status.toLowerCase().includes("respins")) statusClass = "status-rejected";

                    // Tipul cererii
                    const tipCerere = req.tipCerere || req.tip || req.titlu || 'Cerere Generală';

                    // Data creării
                    let dataCrearii = "Recentă";
                    if (req.data && req.data.seconds) {
                        dataCrearii = new Date(req.data.seconds * 1000).toLocaleString('ro-RO', {
                            day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                    } else if (req.createdAt && req.createdAt.seconds) {
                        dataCrearii = new Date(req.createdAt.seconds * 1000).toLocaleString('ro-RO', {
                            day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                    } else if (req.data) {
                        dataCrearii = req.data;
                    }

                    return `
                        <div class="request-card">
                            <div>
                                <div class="card-header">
                                    <span class="dept-badge">${tipCerere}</span>
                                    <span class="status-badge ${statusClass}">${statusText}</span>
                                </div>
                                <div class="card-details">
                                    <div><strong>Tip Cerere:</strong> ${tipCerere}</div>
                                    <div><strong>Data creării:</strong> ${dataCrearii}</div>
                                </div>
                            </div>
                            <button class="btn-details" onclick="deschideDetalii('${req.id}')">
                                Mai multe detalii
                            </button>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Eroare încărcare cereri:", err);
                container.innerHTML = `<div class="empty-state">A apărut o eroare la încărcarea cererilor.</div>`;
            }
        });

        // Funcția de afișare modal cu detaliile complete
        window.deschideDetalii = function(id) {
            const req = userRequestsCache.find(r => r.id === id);
            if (!req) return;

            const modal = document.getElementById("details-modal-overlay");
            const content = document.getElementById("modal-body-content");
            const modalTitle = document.getElementById("modal-title");

            const tipCerere = req.tipCerere || req.tip || req.titlu || 'Cerere Generală';
            
            let dataCrearii = "Nespecificată";
            if (req.data && req.data.seconds) {
                dataCrearii = new Date(req.data.seconds * 1000).toLocaleString('ro-RO', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            } else if (req.createdAt && req.createdAt.seconds) {
                dataCrearii = new Date(req.createdAt.seconds * 1000).toLocaleString('ro-RO', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            } else if (req.data) {
                dataCrearii = req.data;
            }

            const status = req.status || req.stare || "În așteptare";
            // Preluăm administratorul care a procesat cererea
            const decisaDe = req.procesatDe || req.aprobatDe || req.respinsDe || req.verificatDe || req.adminName || req.admin || "În așteptare (Ne-procesată)";
            const motiv = req.motivRespingere || req.motiv || req.observatii || req.notaAdmin || null;

            if (modalTitle) modalTitle.textContent = `Detalii Cerere - #${req.id.substring(0, 8)}`;

            content.innerHTML = `
                <div class="detail-row"><strong>Tip Cerere:</strong> ${tipCerere}</div>
                <div class="detail-row"><strong>Nume Titular / Afacere:</strong> ${req.numeAfacere || req.nume || 'N/A'}</div>
                <div class="detail-row"><strong>Data Creării:</strong> ${dataCrearii}</div>
                <div class="detail-row"><strong>ID Cerere:</strong> ${req.id}</div>
                ${req.discordId ? `<div class="detail-row"><strong>Discord ID:</strong> ${req.discordId}</div>` : ''}
                ${req.descriere ? `<div class="detail-row"><strong>Descriere:</strong> ${req.descriere}</div>` : ''}
                ${req.telefon ? `<div class="detail-row"><strong>Telefon:</strong> ${req.telefon}</div>` : ''}

                <div class="status-box">
                    <div class="detail-row"><strong>Status:</strong> ${status}</div>
                    <div class="detail-row"><strong>Acceptat / Respins de:</strong> ${decisaDe}</div>
                    ${motiv ? `<div class="detail-row"><strong>Motiv / Observații:</strong> ${motiv}</div>` : ''}
                </div>
            `;

            modal.classList.add("show");
        };

        // Event listener închidere modal
        document.addEventListener("DOMContentLoaded", () => {
            const modal = document.getElementById("details-modal-overlay");
            const closeBtn = document.getElementById("modal-close-btn");

            if (closeBtn) closeBtn.onclick = () => modal.classList.remove("show");
            if (modal) modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("show"); };
        });
    </script>
</body>
</html>

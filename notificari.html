<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificări | Portal PCLS</title>
<style>
:root{
 color-scheme:dark;
 --bg:#05070c;--glass:rgba(18,25,40,.62);--line:rgba(255,255,255,.11);
 --text:#f7f9ff;--muted:#b8c0d0;--quiet:#7f8aa0;--accent:#64d2ff;
 --mint:#63e6be;--danger:#ff6961;--gold:#ffd60a;--violet:#bf5af2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
 color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(10,132,255,.24),transparent 30%),
 radial-gradient(circle at 85% 12%,rgba(191,90,242,.16),transparent 28%),linear-gradient(145deg,#070b14,#090d18 40%,#05070c);
}
a{color:inherit;text-decoration:none}
.page{width:min(980px,100%);margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.title{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.05em}
.subtitle{margin-top:7px;color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 15px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700}
.btn:hover{background:rgba(255,255,255,.09)}
.btn-primary{border-color:rgba(100,210,255,.3);background:linear-gradient(135deg,rgba(10,132,255,.2),rgba(100,210,255,.08))}
.notification-list{display:grid;gap:12px}
.notification{
 padding:19px;border-radius:22px;border:1px solid var(--line);
 background:linear-gradient(145deg,rgba(18,25,40,.67),rgba(15,19,34,.48));
 box-shadow:inset 0 1px rgba(255,255,255,.04),0 18px 50px rgba(0,0,0,.12);
 transition:.22s ease;
}
.notification:hover{transform:translateY(-2px);border-color:rgba(100,210,255,.25)}
.notification[data-request-url]{cursor:pointer}
.notification.unread{border-color:rgba(100,210,255,.25);box-shadow:inset 3px 0 0 var(--accent),0 18px 50px rgba(0,0,0,.12)}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.badge{padding:6px 10px;border-radius:999px;font-size:.7rem;font-weight:800}
.badge.approved{color:var(--mint);background:rgba(99,230,190,.12);border:1px solid rgba(99,230,190,.25)}
.badge.rejected{color:var(--danger);background:rgba(255,105,97,.12);border:1px solid rgba(255,105,97,.25)}
h2{font-size:1rem}
.message{margin-top:8px;color:var(--muted);line-height:1.55;font-size:.9rem}
.meta{margin-top:12px;color:var(--quiet);font-size:.73rem}
.notification-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.empty{padding:55px 22px;text-align:center;border:1px solid var(--line);border-radius:22px;background:rgba(18,25,40,.42);color:var(--quiet)}
.status-note{color:var(--muted);font-size:.8rem;margin-bottom:14px}
@media(max-width:650px){.header{align-items:flex-start;flex-direction:column}.actions,.btn{width:100%}.top{flex-direction:column}}
</style>
</head>
<body>
<div class="page">
 <div class="header">
   <div>
     <div class="title">Centrul de notificări</div>
     <div class="subtitle">Aici apar imediat modificările făcute asupra cererilor tale.</div>
   </div>
   <div class="actions">
     <a class="btn" href="index.html">← Portal</a>
     <button id="mark-all" class="btn" type="button">Marchează toate citite</button>
   </div>
 </div>
 <div id="status" class="status-note">Se încarcă notificările...</div>
 <div id="notification-list" class="notification-list"></div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  collection, query, where, onSnapshot, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const list = document.getElementById("notification-list");
const status = document.getElementById("status");
const markAllBtn = document.getElementById("mark-all");
let unsubscribe = null;

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]));}
function fmt(v){
 try{
  const d=v?.toDate?v.toDate():new Date(v);
  return Number.isNaN(d.getTime())?"-":new Intl.DateTimeFormat("ro-RO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(d);
 }catch(_){return "-";}
}
function render(items){
 const unread=items.filter(x=>x.read!==true).length;
 status.textContent = unread ? `${unread} notificări necitite.` : `Nu ai notificări necitite.`;
 if(!items.length){
   list.innerHTML='<div class="empty">Nu există notificări pentru contul tău.</div>';
   return;
 }
 list.innerHTML=items.map(n=>{
   const approved=n.status==="aprobat"||n.status==="acceptat";
   const badge=approved?"Aprobată":"Respinsă";
   return `<article class="notification ${n.read===true?"":"unread"}" data-request-url="${esc(n.requestUrl||`cererile_mele.html?cerere=${encodeURIComponent(n.requestId||"")}`)}" data-notification-id="${esc(n.id)}">
     <div class="top"><div><h2>${esc(n.title||"Notificare")}</h2></div><span class="badge ${approved?"approved":"rejected"}">${badge}</span></div>
     <div class="message">${esc(n.message||"")}</div>
     <div class="meta">Data: ${esc(fmt(n.createdAt||n.created_at))} · Cerere: ${esc(n.requestId||"-")}</div>
     <div class="notification-actions">
       ${n.read===true?"":`<button class="btn" data-read="${esc(n.id)}" type="button">Marchează citită</button>`}
       <a class="btn btn-primary" href="${esc(n.requestUrl||`cererile_mele.html?cerere=${encodeURIComponent(n.requestId||"")}`)}">Deschide cererea</a>
     </div>
   </article>`;
 }).join("");
}
list.addEventListener("click",async e=>{
 const btn=e.target.closest("[data-read]");
 if(btn){
   try{await updateDoc(doc(db,"notificari",btn.dataset.read),{read:true});}catch(err){console.error(err);}
   return;
 }
 const card=e.target.closest(".notification[data-request-url]");
 if(!card || e.target.closest("a,button")) return;
 const notificationId=card.dataset.notificationId;
 const target=card.dataset.requestUrl;
 try{await updateDoc(doc(db,"notificari",notificationId),{read:true});}catch(err){console.error(err);}
 window.location.href=target;
});
markAllBtn.addEventListener("click",async()=>{
 const unread=[...list.querySelectorAll("[data-read]")].map(b=>b.dataset.read);
 await Promise.all(unread.map(id=>updateDoc(doc(db,"notificari",id),{read:true})));
});
onAuthStateChanged(auth,user=>{
 if(unsubscribe)unsubscribe();
 if(!user){window.location.href="auth.html";return;}
 const accountIdentifier=user.providerData?.[0]?.uid||user.uid;
 const q=query(collection(db,"notificari"),where("recipientId","==",accountIdentifier));
 unsubscribe=onSnapshot(q,snap=>{
   render(snap.docs
     .map(d=>({id:d.id,...d.data()}))
     .sort((a,b)=>{
       const ad=a.createdAt?.toDate?a.createdAt.toDate():new Date(a.createdAt||0);
       const bd=b.createdAt?.toDate?b.createdAt.toDate():new Date(b.createdAt||0);
       return bd-ad;
     }));
 },err=>{
   console.error("Eroare notificari:",err);
   status.textContent="Nu s-au putut încărca notificările.";
   list.innerHTML='<div class="empty">Verifică regulile Firestore pentru colecția „notificari”.</div>';
 });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - PCLS Portal</title>
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050505;
            --accent-green: #00ffa3;
            --accent-green-glow: rgba(0, 255, 163, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #88928c;
            --surface-bg: rgba(255, 255, 255, 0.02);
            --surface-border: rgba(255, 255, 255, 0.08);
            --input-bg: #0d0f0e;
            --card-bg: #0a0c0b;
            --error: #ff3c64;
            --discord-color: #5865F2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 255, 163, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 150, 255, 0.03) 0%, transparent 40%);
        }

        .auth-box {
            background: var(--card-bg);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 44px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .badge-logo {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(0, 255, 163, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 163, 0.2);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        h2 span {
            color: var(--accent-green);
        }

        #mesaj {
            text-align: center;
            margin-bottom: 22px;
            font-weight: 500;
            min-height: 22px;
            font-size: 0.88rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .label-optional {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: none;
            font-weight: 400;
            margin-left: 5px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 2;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: var(--input-bg);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: rgba(136, 146, 140, 0.45);
        }

        input:focus {
            border-color: rgba(0, 255, 163, 0.5);
            box-shadow: 0 0 0 3px var(--accent-green-glow);
            background: #0f1210;
        }

        .password-container input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 3;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .actions {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button.btn-main, button.btn-alt, button.btn-discord {
            width: 100%;
            padding: 14px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button.btn-main {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 163, 0.2);
        }

        button.btn-main:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 255, 163, 0.3);
        }

        button.btn-alt {
            background: var(--surface-bg);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
        }

        button.btn-alt:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* --- Discord Button & Divider --- */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px 0;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider span {
            padding: 0 12px;
        }

        button.btn-discord {
            background: linear-gradient(145deg, rgba(88, 101, 242, 0.15), rgba(88, 101, 242, 0.05));
            border: 1px solid rgba(88, 101, 242, 0.3);
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
        }

        button.btn-discord:hover {
            background: linear-gradient(145deg, rgba(88, 101, 242, 0.25), rgba(88, 101, 242, 0.1));
            border-color: rgba(88, 101, 242, 0.6);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        a.back-link {
            color: var(--text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            text-align: center;
            margin-top: 24px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        a.back-link:hover {
            color: var(--accent-green);
        }
    
        /* LIQUID GLASS */
        body {
            background-color: #05070d;
            background-image:
                radial-gradient(circle at 18% 10%, rgba(76, 141, 255, 0.16) 0%, transparent 34%),
                radial-gradient(circle at 82% 82%, rgba(167, 124, 255, 0.13) 0%, transparent 35%),
                radial-gradient(circle at 54% 24%, rgba(0, 255, 163, 0.10) 0%, transparent 42%),
                linear-gradient(145deg, #04070d 0%, #07101c 48%, #05070d 100%);
            background-attachment: scroll;
        }

        .auth-box {
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.085), rgba(255, 255, 255, 0.025) 48%, rgba(6, 12, 23, 0.52));
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.46),
                0 10px 34px rgba(76, 141, 255, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                inset 0 -1px 0 rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(22px) saturate(155%);
            -webkit-backdrop-filter: blur(22px) saturate(155%);
        }

        .badge-logo {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(0, 255, 163, 0.065));
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px) saturate(145%);
            -webkit-backdrop-filter: blur(12px) saturate(145%);
        }

        input {
            background: linear-gradient(180deg, rgba(5, 11, 21, 0.56), rgba(4, 8, 16, 0.72));
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.045),
                0 8px 24px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(12px) saturate(135%);
            -webkit-backdrop-filter: blur(12px) saturate(135%);
        }

        input:focus {
            background: linear-gradient(180deg, rgba(8, 18, 31, 0.68), rgba(4, 10, 18, 0.82));
            border-color: rgba(124, 231, 255, 0.44);
            box-shadow:
                0 0 0 3px rgba(124, 231, 255, 0.075),
                0 12px 30px rgba(76, 141, 255, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .toggle-password {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        button.btn-main {
            background: linear-gradient(105deg, rgba(0, 255, 163, 0.92), rgba(124, 231, 255, 0.90));
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow:
                0 14px 28px rgba(0, 255, 163, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        button.btn-alt {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.022));
            border-color: rgba(255, 255, 255, 0.13);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
        }

        button.btn-alt:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(124, 231, 255, 0.035));
            border-color: rgba(124, 231, 255, 0.20);
        }
    </style>
</head>
<body>

    <div class="auth-box">
        <div class="auth-header">
            <span class="badge-logo">PCLS Portal</span>
            <h2>Sistem de <span>Autentificare</span></h2>
        </div>

        <div id="mesaj"></div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
                <div class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <input type="email" id="email" placeholder="nume@email.com" required autocomplete="email">
            </div>
        </div>
        
        <div class="form-group">
            <label for="parola">Parolă</label>
            <div class="input-wrapper password-container">
                <div class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" id="parola" placeholder="Minim 6 caractere" required>
                <button type="button" id="togglePassword" class="toggle-password" aria-label="Arată parola">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="codAcces">Cheiță Acces <span class="label-optional">(Doar pt. creare cont / Lăsați gol pt. grad Membru)</span></label>
            <div class="input-wrapper">
                <div class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                    </svg>
                </div>
                <input type="text" id="codAcces" placeholder="Ex: ADMIN-123XYZ (Generat din panou)" autocomplete="off">
            </div>
        </div>
        
        <div class="actions">
            <button id="btnLogin" class="btn-main">Autentificare</button>
            <button id="btnRegister" class="btn-alt">Creează Cont Nou</button>
            
            <div class="divider">
                <span>sau</span>
            </div>

            <button id="btnDiscordLogin" class="btn-discord">
                <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
                </svg>
                Conectare cu Discord
            </button>
        </div>

        <a href="index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Înapoi la site
        </a>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        // Am adăugat importurile pentru OAuth și OIDC
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword, OAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        // Am adăugat getDoc și serverTimestamp
        import { doc, setDoc, getDoc, getDocs, updateDoc, collection, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const emailInput = document.getElementById('email');
        const parolaInput = document.getElementById('parola');
        const codInput = document.getElementById('codAcces');
        const mesajDiv = document.getElementById('mesaj');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        const eyeOpenSVG = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        const eyeClosedSVG = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

        togglePassword.addEventListener('click', () => {
            const isPassword = parolaInput.getAttribute('type') === 'password';
            parolaInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword ? eyeClosedSVG : eyeOpenSVG;
        });

        const getDiscordDisplayName = (user) => {
            const providerData = user?.providerData || [];
            const discordProvider = providerData.find(p => p.providerId === 'oidc.discord' || p.providerId.includes('discord'));
            const firebaseUsername = user?.reloadUserInfo?.screenName || user?.reloadUserInfo?.displayName;
            return firebaseUsername || discordProvider?.displayName || user?.displayName || user?.email || 'Utilizator Discord';
        };

        // ==========================================
        // LOGICA DE ÎNREGISTRARE (EMAIL/PAROLĂ)
        // ==========================================
        document.getElementById('btnRegister').addEventListener('click', async () => {
            try {
                if(!emailInput.value || !parolaInput.value) {
                    throw new Error("Te rog completează email-ul și parola.");
                }

                mesajDiv.style.color = "var(--accent-green)";
                mesajDiv.textContent = "Se validează datele...";

                let rolAtribuit = "user"; 
                let codId = null;
                const codIntrodus = codInput.value.trim();

                if (codIntrodus !== "") {
                    const q = query(
                        collection(db, "invite_codes"), 
                        where("code", "==", codIntrodus), 
                        where("used", "==", false)
                    );
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        throw new Error("Codul de acces este invalid sau a fost deja folosit!");
                    }

                    const documentCod = querySnapshot.docs[0];
                    rolAtribuit = documentCod.data().role; 
                    codId = documentCod.id; 
                }

                mesajDiv.textContent = "Se creează contul...";
                const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, parolaInput.value);
                const user = userCredential.user;

                await setDoc(doc(db, "utilizatori", user.uid), {
                    email: user.email,
                    role: rolAtribuit, 
                    stare: "Activ",
                    createdAt: serverTimestamp()
                });

                if (codId) {
                    await updateDoc(doc(db, "invite_codes", codId), {
                        used: true,
                        used_by: user.email 
                    });
                }

                window.location.href = "index.html";
            } catch (error) {
                mesajDiv.style.color = "var(--error)";
                mesajDiv.textContent = error.message.replace("Firebase: ", "");
            }
        });
        
        // ==========================================
        // LOGICA DE CONECTARE (EMAIL/PAROLĂ)
        // ==========================================
        document.getElementById('btnLogin').addEventListener('click', async () => {
            try {
                if(!emailInput.value || !parolaInput.value) {
                    throw new Error("Te rog completează email-ul și parola.");
                }

                mesajDiv.style.color = "var(--accent-green)";
                mesajDiv.textContent = "Se conectează...";
                await signInWithEmailAndPassword(auth, emailInput.value, parolaInput.value);
                window.location.href = "index.html";
            } catch (error) {
                mesajDiv.style.color = "var(--error)";
                mesajDiv.textContent = "Email sau parolă incorectă.";
            }
        });

        // ==========================================
        // LOGICA DE CONECTARE / ÎNREGISTRARE CU DISCORD
        // ==========================================
        const btnDiscordLogin = document.getElementById('btnDiscordLogin');
        if (btnDiscordLogin) {
            btnDiscordLogin.addEventListener('click', async () => {
                // Aici apelăm providerul generat în Firebase
                const provider = new OAuthProvider('oidc.oidc.discord');
                    provider.addScope('identify');

                try {
                    mesajDiv.style.color = "var(--accent-green)";
                    mesajDiv.textContent = "Se deschide Discord...";
                    
                    const result = await signInWithPopup(auth, provider);
                    const user = result.user;
                    const numeDiscord = getDiscordDisplayName(user);
                    console.log("Utilizator Discord autentificat:", user);
                    console.log("Nume Discord:", numeDiscord);

                    // Extragem ID-ul de Discord
                    const discordData = user.providerData.find(p => p.providerId === 'oidc.discord' || p.providerId.includes('discord'));
                    const discordId = discordData ? discordData.uid : null;

                    // Verificăm dacă utilizatorul există deja în baza de date
                    const userRef = doc(db, "utilizatori", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (!userSnap.exists()) {
                        // Creăm profilul dacă e prima dată când intră pe site prin Discord
                        await setDoc(userRef, {
                            email: user.email || "",
                            nume: numeDiscord,
                            discordId: discordId,
                            role: "user", // Membru standard
                            stare: "Activ",
                            createdAt: serverTimestamp()
                        });
                    } else {
                        // Dacă există, doar îi actualizăm Discord ID-ul și momentul logării (fără să-i stricăm rolul)
                        await setDoc(userRef, {
                            nume: numeDiscord,
                            discordId: discordId,
                            ultimaLogare: serverTimestamp()
                        }, { merge: true });
                    }

                    mesajDiv.textContent = `Conectat cu succes! Bun venit, ${numeDiscord}`;
                    window.location.href = "index.html";
                } catch (error) {
                    console.error("Eroare la autentificarea cu Discord:", error);
                    mesajDiv.style.color = "var(--error)";
                    mesajDiv.textContent = "A apărut o problemă la conectarea cu Discord.";
                }
            });
        }
    </script>
</body>
</html>

name: Fix Discord cookie profile UI and settings access

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cookie profile UI and settings auth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Restore the existing profile dropdown markup/classes used by the site,
          # while keeping the server-side cookie session as the source of identity.
          p = Path('index-modernizer.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'function renderCookieUser\(user\) \{.*?\n\}\n\nfunction escapeHtml', re.S)
          replacement = r'''function renderCookieUser(user) {
            const authContainer = document.getElementById("auth-section-premium") || document.getElementById("auth-links");
            if (!authContainer) return;
            const name = String(user?.name || "Utilizator Discord").trim();
            const initial = (name.charAt(0) || "U").toUpperCase();

            authContainer.innerHTML = `
              <div class="user-profile-premium">
                <button class="profile-btn-premium" id="profileToggle" type="button">
                  <span>Salut, ${escapeHtml(name)}</span>
                  <div class="profile-avatar">${escapeHtml(initial)}</div>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <div class="profile-dropdown-premium" id="profileDropdown">
                  <div class="dropdown-user-info"><span>Conectat</span><strong>${escapeHtml(name)}</strong></div>
                  <div class="dropdown-divider"></div>
                  <a href="cererile_mele.html" class="dropdown-item-premium">Cererile Mele</a>
                  <a href="setari.html" class="dropdown-item-premium">Setări cont</a>
                  <div class="dropdown-divider"></div>
                  <button id="btnLogout" class="dropdown-item-premium" style="color:#ff6b6b;background:none;border:none;width:100%;text-align:left;cursor:pointer;">Deconectare</button>
                </div>
              </div>`;

            const profileToggle = document.getElementById("profileToggle");
            const profileDropdown = document.getElementById("profileDropdown");
            if (profileToggle && profileDropdown) {
              profileToggle.onclick = event => { event.stopPropagation(); profileDropdown.classList.toggle("show"); };
              if (!window.__pclsProfileClickBound) {
                window.__pclsProfileClickBound = true;
                document.addEventListener("click", event => {
                  const t = document.getElementById("profileToggle");
                  const d = document.getElementById("profileDropdown");
                  if (t && d && !t.contains(event.target) && !d.contains(event.target)) d.classList.remove("show");
                });
              }
            }

            document.getElementById("btnLogout")?.addEventListener("click", async () => {
              try { await fetch("/api/logout", { method: "POST", credentials: "same-origin", cache: "no-store" }); }
              finally { window.location.href = "auth.html"; }
            });
          }

function escapeHtml'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('index-modernizer.js renderCookieUser block not found')
          p.write_text(s2, encoding='utf-8')

          # Make setari.html accept the Discord cookie session when Firebase Auth is unavailable.
          p = Path('setari.html')
          s = p.read_text(encoding='utf-8')
          old = '''    onAuthStateChanged(auth, (user) => {
        if (!user) {
            if (unsubscribeUserDoc) unsubscribeUserDoc();
            window.location.href = "auth.html";
            return;
        }

        if (userEmailInput) userEmailInput.value = user.email || "";'''
          new = '''    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            try {
                const response = await fetch("/api/me", { credentials: "same-origin", cache: "no-store" });
                const data = await response.json().catch(() => ({}));
                if (response.ok && data.ok && data.user) {
                    if (userEmailInput) userEmailInput.value = data.user.email || "";
                    if (displayNameInput) displayNameInput.value = data.user.name || "";
                    if (userRoleElem) userRoleElem.textContent = "UTILIZATOR DISCORD";
                    const statusEl = document.getElementById("userStatus");
                    if (statusEl) statusEl.textContent = "Activ";
                    if (profileForm) profileForm.addEventListener("submit", event => {
                        event.preventDefault();
                        showMessage("Numele pentru conectarea Discord este gestionat prin profilul Discord.", false);
                    }, { once: true });
                    if (btnResetPassword) btnResetPassword.disabled = true;
                    return;
                }
            } catch (cookieError) {
                console.error("Cookie auth settings:", cookieError);
            }
            if (unsubscribeUserDoc) unsubscribeUserDoc();
            window.location.href = "auth.html";
            return;
        }

        if (userEmailInput) userEmailInput.value = user.email || "";'''
          if old not in s:
              raise SystemExit('setari.html auth guard not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-modernizer.js setari.html
          git commit -m "Fix cookie profile dropdown and settings access [skip ci]"
          git push

          # Remove this one-time workflow in a follow-up commit so it never runs again.
          rm -f .github/workflows/fix-discord-cookie-ui-settings.yml
          git add -u .github/workflows/fix-discord-cookie-ui-settings.yml
          git commit -m "Remove one-time cookie UI fix workflow [skip ci]"
          git push
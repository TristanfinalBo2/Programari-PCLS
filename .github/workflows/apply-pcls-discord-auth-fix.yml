name: Apply PCLS Discord auth fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Firebase Discord OAuth with server session
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pcls_page.html')
          s = p.read_text(encoding='utf-8')

          # Stop using Firebase OIDC popup. The canonical Discord login is the server-side cookie OAuth.
          s = s.replace(
              'import { onAuthStateChanged, OAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";',
              'import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";'
          )

          connect_pattern = re.compile(r'async function connectDiscord\(\) \{.*?\n\}', re.S)
          connect_replacement = '''async function connectDiscord() {
    const returnTo = `${window.location.pathname}${window.location.search}${window.location.hash}`;
    window.location.href = `/api/discord-auth?return_to=${encodeURIComponent(returnTo)}`;
}'''
          s, n = connect_pattern.subn(connect_replacement, s, count=1)
          if n != 1:
              raise SystemExit('connectDiscord block not found')

          auth_pattern = re.compile(r'onAuthStateChanged\(auth, async \(user\) => \{.*?\n\}\);\n\n    // Prevenire dev tools', re.S)
          auth_replacement = '''onAuthStateChanged(auth, async (user) => {
    let discordVal = "";

    try {
        const response = await fetch("/api/me", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: { Accept: "application/json" }
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data?.ok && data?.user?.discordId) {
            discordVal = String(data.user.discordId).trim();
        }
    } catch (error) {
        console.warn("Sesiunea Discord nu a putut fi citită:", error);
    }

    if (!discordVal && user) {
        try {
            const userSnap = await getDoc(doc(db, "utilizatori", user.uid));
            if (userSnap.exists()) {
                const data = userSnap.data() || {};
                discordVal = String(data.discordId || data.discord_id || "").trim();
            }
        } catch (error) {
            console.warn("Discord ID din profil nu a putut fi citit:", error);
        }
    }

    currentDiscordValue = discordVal;
    discordInput.value = discordVal;
    discordConnectedBox.style.display = discordVal ? "flex" : "none";
    discordLoginBox.style.display = discordVal ? "none" : "block";
    if (submitButton) submitButton.disabled = !discordVal;
});

    // Prevenire dev tools'''
          s, n = auth_pattern.subn(auth_replacement, s, count=1)
          if n != 1:
              raise SystemExit('auth state block not found')

          # Keep all existing form markup and logic intact.
          p.write_text(s, encoding='utf-8')

      - name: Verify PCLS page and OAuth flow
        shell: bash
        run: |
          test -s pcls_page.html
          grep -q '^<!DOCTYPE html>' pcls_page.html
          grep -q '</html>' pcls_page.html
          grep -q 'async function connectDiscord' pcls_page.html
          grep -q '/api/discord-auth?return_to=' pcls_page.html
          grep -q 'fetch("/api/me"' pcls_page.html
          ! grep -q 'signInWithPopup(auth, provider)' pcls_page.html
          ! grep -q 'OAuthProvider("oidc.oidc.discord")' pcls_page.html

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pcls_page.html
          git commit -m 'Fix PCLS Discord session identification [skip ci]'
          git push
          git rm .github/workflows/apply-pcls-discord-auth-fix.yml
          git commit -m 'Remove one-time PCLS Discord auth fixer [skip ci]'
          git push

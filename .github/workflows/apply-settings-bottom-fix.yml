name: Apply settings bottom menu fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add settings CSS override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('setari.html')
          h = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="setari-bottom-menu.css">'
          if link not in h:
              marker = '</head>'
              if marker not in h:
                  raise SystemExit('head marker missing')
              h = h.replace(marker, f'  {link}\n{marker}', 1)
              p.write_text(h, encoding='utf-8')
          PY
      - name: Verify
        run: grep -q 'setari-bottom-menu.css' setari.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add setari.html setari-bottom-menu.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix bottom settings menu layout [skip ci]'
          git push

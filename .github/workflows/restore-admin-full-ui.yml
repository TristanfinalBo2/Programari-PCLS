name: Restore full Admin UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore legacy full admin page and switch auth/actions to cookie API
        shell: bash
        run: |
          git checkout cf5957c76ec378e404f509290e0c6ee47eb63326 -- admin.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          new_script = r'''<script>
  const ROLE_PERMISSIONS = {
    superadmin: ["all"],
    admin: ["all"],
    conducere: ["isuls", "dsls", "mmls", "ssmls"],
    isuls: ["isuls"],
    dsls: ["dsls"],
    mmls: ["mmls", "mm"],
    ssmls: ["ssmls", "ssmmls"]
  };

  let currentUser = null;
  let currentUserRole = null;
  let allCereri = [];
  let currentFilter = "all";
  let currentSearch = "";
  let pendingDeleteId = null;
  let pendingApproveId = null;
  let currentOpenItem = null;

  const cereriContainer = document.getElementById("cereri-container");
  const totalCountEl = document.getElementById("total-count");
  const filterButtons = document.querySelectorAll(".filter-btn");
  const searchInput = document.getElementById("cereri-search");
  const searchClearBtn = document.getElementById("cereri-search-clear");
  const approveModal = document.getElementById("approve-modal");
  const approveOkBtn = document.getElementById("approve-ok-btn");
  const approveCancelBtn = document.getElementById("approve-cancel-btn");
  const approveCloseBtn = document.getElementById("approve-close");
  const approveCopyBtn = document.getElementById("approve-copy-btn");
  const confirmModal = document.getElementById("confirm-modal");
  const confirmOkBtn = document.getElementById("confirm-ok-btn");
  const confirmCancelBtn = document.getElementById("confirm-cancel-btn");
  const confirmCloseBtn = document.getElementById("confirm-close");
  const detailsModal = document.getElementById("details-modal");
  const detailsClose = document.getElementById("details-close");
  const detailsCloseBtn = document.getElementById("details-close-btn");
  const detailsTrashBtn = document.getElementById("details-trash-btn");
  const detailsCopyBtn = document.getElementById("details-copy-btn");
  const btnGenerateCode = document.getElementById("btn-generate-code");
  const inviteRoleSelect = document.getElementById("invite-role-select");
  const generatedCodeDisplay = document.getElementById("generated-code-display");

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]));
  }
  function normalizeSearchText(value) {
    return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }
  function normalizeRole(value) {
    const r = String(value || "").trim().toLowerCase().replace(/\s+/g, "");
    if (r === "conducerea") return "conducere";
    if (r === "mm" || r === "mmlls") return "mmls";
    if (r === "ssmmls") return "ssmls";
    return r;
  }
  function getCurrentAdminName() {
    return currentUser?.name || currentUser?.email || currentUser?.discordId || "Admin PCLS";
  }
  function showToast(message, type = "success") {
    const container = document.getElementById("toast-container");
    if (!container) return;
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `<div class="toast-icon">${type === 'success' ? '✓' : type === 'warning' ? '!' : '×'}</div><div class="toast-content"><div class="toast-title">${type === 'success' ? 'Succes' : type === 'warning' ? 'Atenție' : 'Eroare'}</div><div class="toast-message">${escapeHtml(message)}</div></div><div class="toast-progress"></div>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  async function api(method = "GET", body = null) {
    const options = { method, credentials: "same-origin", cache: "no-store", headers: {} };
    if (body) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const response = await fetch("/api/admin-data", options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(data.error || `HTTP ${response.status}`);
      error.status = response.status;
      throw error;
    }
    return data;
  }

  function roleCanSee(role, item) {
    if (["superadmin", "admin"].includes(role)) return true;
    const text = [item.departament, item.departament_medical, item.department, item.dept, item.tip_cerere, item.tip, item.eveniment].filter(Boolean).join(" ").toLowerCase();
    return (ROLE_PERMISSIONS[role] || []).some(k => k !== "all" && text.includes(k));
  }

  async function initAdmin() {
    try {
      const data = await api("GET");
      currentUser = data.user || null;
      currentUserRole = normalizeRole(data.role || data.user?.role || "");
      allCereri = Array.isArray(data.requests) ? data.requests : [];
      if (!currentUserRole || !ROLE_PERMISSIONS[currentUserRole]) throw new Error("Rol administrator indisponibil.");
      const generatorSection = document.getElementById("admin-generator-section");
      if (generatorSection) generatorSection.style.display = ["superadmin", "admin", "conducere"].includes(currentUserRole) ? "block" : "none";
      adjustFilterButtonsForRole(currentUserRole);
      renderCereri();
    } catch (error) {
      console.error("Cookie admin auth:", error);
      if (error.status === 401) { window.location.href = "auth.html"; return; }
      if (error.status === 403) { window.location.href = "index.html"; return; }
      if (cereriContainer) cereriContainer.innerHTML = `<div class="empty-state">${escapeHtml(error.message || "Nu s-au putut încărca cererile.")}</div>`;
    }
  }

  function adjustFilterButtonsForRole(role) {
    filterButtons.forEach(btn => {
      const filterVal = normalizeSearchText(btn.getAttribute("data-filter") || btn.textContent);
      btn.style.display = "";
      if (["superadmin", "admin", "conducere"].includes(role)) return;
      const allowed = { isuls: "isuls", dsls: "dsls", mmls: "mmls", ssmls: "ssmls" }[role];
      const departmentFilters = ["isuls", "dsls", "mmls", "ssmls", "pcls"];
      if (departmentFilters.includes(filterVal) && filterVal !== allowed) btn.style.display = "none";
    });
  }

  if (btnGenerateCode) {
    btnGenerateCode.addEventListener("click", async () => {
      btnGenerateCode.disabled = true;
      const original = btnGenerateCode.textContent;
      btnGenerateCode.textContent = "Se generează...";
      try {
        const data = await api("POST", { action: "generateInvite", role: inviteRoleSelect?.value || "isuls" });
        if (generatedCodeDisplay) generatedCodeDisplay.innerHTML = `Cod generat: <span style="background:rgba(0,255,163,.1);padding:4px 10px;border-radius:8px;user-select:all;border:1px solid rgba(0,255,163,.2);">${escapeHtml(data.code)}</span><br><span style="font-size:.85rem;color:var(--text-muted);font-weight:normal;margin-top:5px;display:block;">(Copiază-l și oferă-l adminului nou)</span>`;
        showToast("Cod generat și salvat cu succes!", "success");
      } catch (e) {
        showToast(e.message || "Eroare la generarea codului.", "error");
      } finally {
        btnGenerateCode.disabled = false;
        btnGenerateCode.textContent = original;
      }
    });
  }

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      filterButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter") || btn.textContent.trim();
      renderCereri();
    });
  });
  if (searchInput) searchInput.addEventListener("input", () => { currentSearch = normalizeSearchText(searchInput.value); if (searchClearBtn) searchClearBtn.hidden = !currentSearch; renderCereri(); });
  if (searchClearBtn) searchClearBtn.addEventListener("click", () => { currentSearch = ""; searchInput.value = ""; searchClearBtn.hidden = true; searchInput.focus(); renderCereri(); });

  function statusInfo(item) {
    const status = String(item.status || "in_asteptare").toLowerCase().trim();
    const actor = String(item.procesat_de_nume || "").trim() || String(item.procesat_de || "").replace(/\s*\((?:Aprobat cererea|Respins cererea|aprobat|respins).*/i, "").trim();
    const accepted = status.includes("aprobat");
    const rejected = status.includes("respins");
    const label = accepted ? "Acceptată de" : rejected ? "Respinsă de" : "Procesată de";
    return { status, actor: actor || "-", label };
  }

  function renderCereri() {
    if (!cereriContainer) return;
    const visible = allCereri.filter(item => roleCanSee(currentUserRole, item));
    const activeCount = visible.filter(c => String(c.status || "in_asteptare").toLowerCase() !== "in_cos" && !c.arhivat && !c.deleted).length;
    if (totalCountEl) totalCountEl.textContent = activeCount;

    let filtered = visible.filter(item => {
      const rawStatus = String(item.status || "in_asteptare").toLowerCase().trim();
      const isTrash = rawStatus === "in_cos" || item.deleted === true;
      const isArchived = item.arhivat === true || item.archived === true || rawStatus === "arhivat";
      const f = String(currentFilter || "all").trim().toLowerCase();
      if (f === "in_cos") return isTrash;
      if (isTrash) return false;
      if (f === "arhivat") return isArchived;
      if (isArchived) return false;
      if (f === "all") return true;
      if (f === "in_asteptare") return rawStatus.includes("asteptare");
      if (f === "pcls") {
        const dept = normalizeSearchText(item.departament);
        const medical = ["isuls", "dsls", "mmls", "mm", "ssmls", "ssmmls"];
        if (medical.includes(dept)) return false;
        const txt = normalizeSearchText([item.tip_cerere, item.tip, item.categorie, item.eveniment].filter(Boolean).join(" "));
        return dept === "pcls" || txt.includes("eveniment") || txt.includes("event") || txt.includes("programare") || txt.includes("inregistrare");
      }
      return normalizeSearchText(item.departament) === f;
    });

    if (currentSearch) {
      filtered = filtered.filter(item => {
        const person = normalizeSearchText([item.nume_proprietar, item.proprietar, item.reprezentant, item.nume].filter(Boolean).join(" "));
        const business = normalizeSearchText([item.nume_afacere, item.unitate, item.denumire_afacere, item.business_name].filter(Boolean).join(" "));
        return person.includes(currentSearch) || business.includes(currentSearch);
      });
    }

    if (!filtered.length) {
      cereriContainer.innerHTML = `<div class="empty-state">${currentSearch ? `Nu am găsit nicio persoană sau afacere pentru „${escapeHtml(searchInput?.value?.trim() || currentSearch)}”.` : "Nu există cereri vizibile pentru filtrul selectat."}</div>`;
      return;
    }

    cereriContainer.innerHTML = filtered.map(item => {
      const tip = item.eveniment || item.tip_cerere || item.tip || "PROGRAMARE";
      const status = String(item.status || "in_asteptare");
      const rawStatus = status.toLowerCase();
      const badgeClass = tip.toLowerCase().includes("eveniment") ? "eveniment" : "programare";
      const statusClass = rawStatus.includes("aprobat") ? "aprobat" : rawStatus.includes("respins") ? "respins" : rawStatus === "in_cos" ? "in_cos" : "in_asteptare";
      const actor = statusInfo(item);
      const processorHtml = actor.actor !== "-" && (rawStatus.includes("aprobat") || rawStatus.includes("respins")) ? `<p><strong>${actor.label}</strong><span>${escapeHtml(actor.actor)}</span></p>` : "";
      let actions = "";
      if (rawStatus === "in_cos" || item.deleted === true) actions = `<button class="btn-action btn-restore" data-id="${item.id}">Restaurează</button><button class="btn-action btn-trash" data-id="${item.id}">Șterge Definitiv</button>`;
      else if (item.arhivat === true || rawStatus === "arhivat") actions = `<button class="btn-action btn-unarchive" data-id="${item.id}">Desarhivează</button><button class="btn-action btn-trash" data-id="${item.id}">Șterge</button>`;
      else actions = `<button class="btn-action btn-details" data-id="${item.id}">Detalii</button><button class="btn-action btn-approve" data-id="${item.id}">Acceptă</button><button class="btn-action btn-reject" data-id="${item.id}">Respinge</button><button class="btn-action btn-archive" data-id="${item.id}">Arhivă</button><button class="btn-action btn-trash" data-id="${item.id}">Șterge</button>`;
      return `<div class="card"><div class="card-header"><span class="type-badge ${badgeClass}">${escapeHtml(tip)}</span><span class="status-badge ${statusClass}">${escapeHtml(status.replace("_", " "))}</span></div><div class="card-body"><p><strong>Nume</strong><span>${escapeHtml(item.nume_proprietar || item.proprietar || item.nume || "-")}</span></p><p><strong>Afacere / Tip</strong><span>${escapeHtml(item.nume_afacere || item.unitate || "-")}</span></p><p><strong>Data & Ora</strong><span>${escapeHtml(item.data_ora || (item.dataProgramare ? `${item.dataProgramare} la ${item.oraProgramare || ""}` : "-"))}</span></p>${processorHtml}</div><div class="card-actions">${actions}</div></div>`;
    }).join("");
    attachActionListeners();
  }

  function applyLocalStatus(id, status, actor = getCurrentAdminName()) {
    const item = allCereri.find(c => c.id === id);
    if (!item) return null;
    const previous = { ...item };
    item.status = status;
    item.deleted = status === "in_cos";
    item.procesat_de_nume = actor;
    item.procesat_de = `${actor} (${status === "aprobat" ? "Aprobat cererea" : status === "respins" ? "Respins cererea" : "Mutat în Coș"})`;
    item.data_procesare = new Date().toLocaleString("ro-RO");
    renderCereri();
    return previous;
  }

  async function saveStatus(id, status, actionName, previous) {
    try {
      await api("POST", { action: "status", id, status, actionName });
      showToast(status === "aprobat" ? "Cererea a fost acceptată." : status === "respins" ? "Cererea a fost respinsă." : "Cererea a fost mutată în Coș.", status === "respins" ? "warning" : "success");
    } catch (e) {
      const item = allCereri.find(c => c.id === id);
      if (item && previous) Object.assign(item, previous);
      renderCereri();
      showToast(e.message || "Eroare la salvarea cererii.", "error");
    }
  }

  function openApproveModal(id) {
    const item = allCereri.find(c => c.id === id);
    if (!item) return;
    pendingApproveId = id;
    document.getElementById("app-nume").textContent = item.nume_proprietar || item.proprietar || item.reprezentant || item.nume || "-";
    document.getElementById("app-adresa").textContent = item.adresa || item.locatie || item.detalii || "-";
    document.getElementById("app-tip").textContent = (item.eveniment || item.tip_cerere || item.tip || "PROGRAMARE").toUpperCase();
    document.getElementById("app-data").textContent = item.data_ora || (item.dataProgramare ? `${item.dataProgramare} la ${item.oraProgramare || ""}` : (item.dataDorita ? `${item.dataDorita} la ${item.oraDorita || ""}` : "-"));
    document.getElementById("app-admin").textContent = `@${getCurrentAdminName().split("@")[0]}`;
    approveModal.classList.add("active");
  }

  function attachActionListeners() {
    document.querySelectorAll(".btn-details").forEach(btn => btn.addEventListener("click", () => openDetailsModal(allCereri.find(c => c.id === btn.dataset.id))));
    document.querySelectorAll(".btn-approve").forEach(btn => btn.addEventListener("click", () => openApproveModal(btn.dataset.id)));
    document.querySelectorAll(".btn-reject").forEach(btn => btn.addEventListener("click", async () => { const id = btn.dataset.id; const prev = applyLocalStatus(id, "respins"); await saveStatus(id, "respins", "Respins cererea", prev); }));
    document.querySelectorAll(".btn-archive").forEach(btn => btn.addEventListener("click", async () => await toggleArchive(btn.dataset.id, true)));
    document.querySelectorAll(".btn-unarchive").forEach(btn => btn.addEventListener("click", async () => await toggleArchive(btn.dataset.id, false)));
    document.querySelectorAll(".btn-trash").forEach(btn => btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const item = allCereri.find(c => c.id === id);
      if (item && (item.status === "in_cos" || item.deleted === true)) { pendingDeleteId = id; confirmModal.classList.add("active"); }
      else { const prev = applyLocalStatus(id, "in_cos"); await saveStatus(id, "in_cos", "Mutat în Coș", prev); }
    }));
    document.querySelectorAll(".btn-restore").forEach(btn => btn.addEventListener("click", async () => { const id = btn.dataset.id; const prev = applyLocalStatus(id, "in_asteptare"); await saveStatus(id, "in_asteptare", "Restaurat cererea", prev); }));
  }

  function closeApproveModal() { approveModal.classList.remove("active"); pendingApproveId = null; }
  approveCloseBtn.addEventListener("click", closeApproveModal);
  approveCancelBtn.addEventListener("click", closeApproveModal);
  approveOkBtn.addEventListener("click", async () => {
    if (!pendingApproveId) return;
    const id = pendingApproveId;
    closeApproveModal();
    const prev = applyLocalStatus(id, "aprobat");
    await saveStatus(id, "aprobat", "Aprobat cererea", prev);
  });
  approveCopyBtn.addEventListener("click", () => {
    const text = `=== CONFIRMARE APROBARE ===\nNume / Reprezentant: ${document.getElementById("app-nume").textContent}\nAdresă / Locație: ${document.getElementById("app-adresa").textContent}\nTip Control / Cerere: ${document.getElementById("app-tip").textContent}\nData & Ora: ${document.getElementById("app-data").textContent}\nProcesat și Acceptat de: ${document.getElementById("app-admin").textContent}`;
    navigator.clipboard.writeText(text).then(() => showToast("Datele de aprobare au fost copiate!", "success")).catch(() => showToast("Eroare la copierea datelor.", "error"));
  });

  async function toggleArchive(id, shouldArchive) {
    const item = allCereri.find(c => c.id === id);
    if (!item) return;
    const previous = { ...item };
    item.arhivat = shouldArchive;
    item.archived = shouldArchive;
    item.procesat_de_nume = getCurrentAdminName();
    item.procesat_de = `${getCurrentAdminName()} (${shouldArchive ? "Arhivat" : "Desarhivat"})`;
    item.data_procesare = new Date().toLocaleString("ro-RO");
    renderCereri();
    try { await api("POST", { action: "archive", id, value: shouldArchive }); showToast(shouldArchive ? "Cererea a fost arhivată." : "Cererea a fost desarhivată.", "success"); }
    catch (e) { Object.assign(item, previous); renderCereri(); showToast(e.message || "Eroare.", "error"); }
  }

  function openDetailsModal(item) {
    if (!item) return;
    currentOpenItem = item;
    document.getElementById("details-code-tag").textContent = item.codEveniment || item.cod_eveniment || item.cod || "PCLS-CERERE";
    const actor = statusInfo(item);
    const fields = [
      { label: "Departament", value: (item.departament || "ISULS").toUpperCase(), size: "third" },
      { label: "Status Curent", value: item.status || "În Așteptare", size: "third" },
      { label: "Data & Ora", value: item.data_ora || item.dataProgramare || "-", size: "third" },
      { label: actor.label, value: actor.actor, highlight: true, full: true },
      { label: "Proprietar / Reprezentant", value: item.nume_proprietar || item.proprietar || item.nume || "-", size: "half" },
      { label: "Telefon Contact", value: item.telefon || item.tel || "-", size: "half" },
      { label: "Nume Afacere", value: item.nume_afacere || item.unitate || "-", size: "half" },
      { label: "Tip Business", value: item.tip_afacere || item.tipSpatiu || "-", size: "half" },
      { label: "Detalii Extra / Locație", value: item.detalii || item.adresa || "-", full: true }
    ];
    document.getElementById("details-container").innerHTML = fields.map(f => `<div class="details-item ${f.full ? 'full-width' : ''} ${f.size === 'half' ? 'half-width' : ''} ${f.size === 'third' ? 'third-width' : ''} ${f.highlight ? 'highlight-user' : ''}"><label>${escapeHtml(f.label)}</label><span>${escapeHtml(f.value || '-')}</span></div>`).join('');
    if (detailsTrashBtn) detailsTrashBtn.textContent = item.status === "in_cos" || item.deleted === true ? "Șterge Definitiv" : "Mută în Coș";
    detailsModal.classList.add("active");
  }
  function closeDetailsModal() { detailsModal.classList.remove("active"); currentOpenItem = null; }
  detailsClose.addEventListener("click", closeDetailsModal);
  detailsCloseBtn.addEventListener("click", closeDetailsModal);
  detailsTrashBtn.addEventListener("click", async () => {
    if (!currentOpenItem) return;
    const id = currentOpenItem.id;
    if (currentOpenItem.status === "in_cos" || currentOpenItem.deleted === true) { pendingDeleteId = id; closeDetailsModal(); confirmModal.classList.add("active"); return; }
    const prev = applyLocalStatus(id, "in_cos"); closeDetailsModal(); await saveStatus(id, "in_cos", "Mutat în Coș din Detalii", prev);
  });
  detailsCopyBtn.addEventListener("click", () => {
    const cod = document.getElementById("details-code-tag").textContent;
    const rows = [...document.querySelectorAll("#details-container .details-item")].map(x => `${x.querySelector("label").textContent}: ${x.querySelector("span").textContent}`).join("\n");
    navigator.clipboard.writeText(`=== DETALII CERERE: ${cod} ===\n\n${rows}`).then(() => showToast("Toate detaliile au fost copiate cu succes!", "success")).catch(() => showToast("Eroare la copiere.", "error"));
  });

  function closeConfirmModal() { confirmModal.classList.remove("active"); pendingDeleteId = null; }
  confirmCancelBtn.addEventListener("click", closeConfirmModal);
  confirmCloseBtn.addEventListener("click", closeConfirmModal);
  confirmOkBtn.addEventListener("click", async () => {
    if (!pendingDeleteId) return;
    const id = pendingDeleteId;
    closeConfirmModal();
    try { await api("POST", { action: "delete", id }); allCereri = allCereri.filter(c => c.id !== id); renderCereri(); showToast("Ștearsă definitiv.", "error"); }
    catch (e) { showToast(e.message || "Eroare la ștergere.", "error"); }
  });

  window.addEventListener("click", event => {
    if (event.target === detailsModal) closeDetailsModal();
    if (event.target === confirmModal) closeConfirmModal();
    if (event.target === approveModal) closeApproveModal();
  });

  initAdmin();
</script>'''

          pattern = re.compile(r'<script type="module">.*?</script>\s*</body>', re.S)
          replacement = new_script + '\n</body>'
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Admin script block not found')
          p.write_text(s2, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Restore full admin page and instant request actions [skip ci]"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/restore-admin-full-ui.yml
          git commit -m "Remove one-time admin UI restore workflow [skip ci]"
          git push

name: Optimize notification performance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Optimize notification client and server calls
        shell: python
        run: |
          from pathlib import Path
          import re

          # Notifications: replace the two live Firestore listeners with one server request.
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')

          m = re.search(r'function startNotificationListeners\(user\)\s*\{.*?\n\}\s*\n\s*function mountDiscordNotificationCenter', h, re.S)
          if not m:
              raise SystemExit('startNotificationListeners block not found')
          new = '''async function startNotificationListeners(user) {
    stopNotificationListeners();
    notificationUserKey = String(user?.uid || user?.providerData?.[0]?.uid || "");
    await loadServerNotifications();
}

async function loadServerNotifications() {
    try {
        const response = await fetch('/api/notifications', { credentials: 'same-origin', cache: 'no-store' });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) return;
        notificationItems = Array.isArray(data.notifications) ? data.notifications : [];
        renderNotifications();
    } catch (error) {
        console.error('Eroare notificări server:', error);
    }
}

function mountDiscordNotificationCenter'''
          h = h[:m.start()] + new + h[m.end():]

          # Add lightweight polling only while tab is visible.
          if 'notificationFastPoll' not in h:
              anchor = 'let notificationDocumentClickHandler = null;'
              h = h.replace(anchor, anchor + '\nlet notificationFastPoll = null;\n', 1)
              h = h.replace('notificationUserKey = String(user?.uid || user?.providerData?.[0]?.uid || "");\n    await loadServerNotifications();', 'notificationUserKey = String(user?.uid || user?.providerData?.[0]?.uid || "");\n    await loadServerNotifications();\n    clearInterval(notificationFastPoll);\n    notificationFastPoll = setInterval(() => { if (document.visibilityState === "visible" && notificationUserKey) loadServerNotifications(); }, 10000);', 1)

          p.write_text(h, encoding='utf-8')

          # Server: cache Google access token in warm Vercel instances.
          for filename in ['api/me.js','api/my-requests.js','api/notifications.js','api/admin-data.js']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if 'let cachedFirebaseToken' not in s:
                  if filename == 'api/me.js':
                      s = s.replace('function decodeString(fields, key) {', 'let cachedFirebaseToken = null;\nlet cachedFirebaseTokenExp = 0;\n\nfunction decodeString(fields, key) {', 1)
                      s = s.replace('async function googleAccessToken() {', 'async function googleAccessToken() {\n  if (cachedFirebaseToken && cachedFirebaseTokenExp > Math.floor(Date.now() / 1000) + 60) return cachedFirebaseToken;', 1)
                      s = s.replace('  return data.access_token;\n}', '  cachedFirebaseToken = data.access_token;\n  cachedFirebaseTokenExp = Math.floor(Date.now() / 1000) + 3500;\n  return cachedFirebaseToken;\n}', 1)
                  else:
                      # These files already name their token helpers differently; use a simple module cache wrapper.
                      if filename == 'api/my-requests.js': target='async function googleAccessToken(sa) {'
                      elif filename == 'api/notifications.js': target='async function accessToken() {'
                      else: target='async function accessToken(sa) {'
                      if target in s:
                          helper = 'let cachedFirebaseToken = null;\nlet cachedFirebaseTokenExp = 0;\n'
                          s = s.replace(target, helper + target, 1)
                          s = s.replace(target, target + '\n  if (cachedFirebaseToken && cachedFirebaseTokenExp > Math.floor(Date.now()/1000) + 60) return cachedFirebaseToken;', 1)
                          s = s.replace('  return data.access_token;\n}', '  cachedFirebaseToken = data.access_token;\n  cachedFirebaseTokenExp = Math.floor(Date.now()/1000) + 3500;\n  return cachedFirebaseToken;\n}', 1)
                  p.write_text(s, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q "fetch('/api/notifications'" index.html
          grep -q 'cachedFirebaseToken' api/me.js
          grep -q 'cachedFirebaseToken' api/notifications.js

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/me.js api/my-requests.js api/notifications.js api/admin-data.js
          git commit -m 'Optimize notification and page loading latency [skip ci]' || true
          git push || true
          git rm .github/workflows/fix-notifications.yml
          git commit -m 'Remove performance fixer workflow [skip ci]' || true
          git push || true

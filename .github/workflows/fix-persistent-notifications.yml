name: Fix persistent notification center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make notification center independent of Firebase auth
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')

          start_pattern = re.compile(r'function startNotificationListeners\(user\)\s*\{.*?\n\}\s*\n\s*function mountDiscordNotificationCenter', re.S)
          start_replacement = '''async function startNotificationListeners(user) {
    stopNotificationListeners();
    notificationUserKey = String(user?.uid || user?.discordId || user?.providerData?.[0]?.uid || "discord");
    await loadServerNotifications();
    clearInterval(window.pclsNotificationPoll || 0);
    window.pclsNotificationPoll = setInterval(() => {
        if (document.visibilityState === "visible") loadServerNotifications();
    }, 15000);
}

async function loadServerNotifications() {
    try {
        const response = await fetch('/api/notifications', {
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) return;
        notificationItems = Array.isArray(data.notifications) ? data.notifications : [];
        renderNotificationCenter();
    } catch (error) {
        console.error('Eroare notificări server:', error);
    }
}

function mountDiscordNotificationCenter'''
          h2, count = start_pattern.subn(start_replacement, h, count=1)
          if count != 1:
              raise SystemExit('startNotificationListeners block not found')
          h = h2

          auth_pattern = re.compile(r'// Centrul de notificări NU modifică authSection\..*?\n\}\);\n\n(?=onAuthStateChanged\(auth, async \(user\) =>)', re.S)
          auth_replacement = '''// Centrul de notificări este independent de Firebase Auth.
// Login-ul portalului folosește sesiunea Discord semnată în cookie.
async function initPersistentDiscordNotifications() {
    try {
        const response = await fetch('/api/me', {
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok || !data.user?.discordId) {
            destroyNotificationCenter();
            return;
        }
        mountDiscordNotificationCenter({
            uid: String(data.user.discordId),
            discordId: String(data.user.discordId),
            providerData: [{ uid: String(data.user.discordId) }]
        });
    } catch (error) {
        console.error('Eroare sesiune Discord notificări:', error);
        destroyNotificationCenter();
    }
}

document.addEventListener('DOMContentLoaded', initPersistentDiscordNotifications);
window.addEventListener('pageshow', () => {
    setTimeout(initPersistentDiscordNotifications, 0);
});

'''
          h2, count = auth_pattern.subn(auth_replacement, h, count=1)
          if count != 1:
              raise SystemExit('notification auth block not found')
          h = h2

          p.write_text(h, encoding='utf-8')

      - name: Make notification API accept recipientId fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/notifications.js')
          s = p.read_text(encoding='utf-8')
          old = '''    const own = await queryByField(token, "recipientDiscordId", discordId, 50);
    let items = own;
    if (!items.length && session.email) items = await queryByField(token, "recipientEmail", String(session.email), 50);'''
          new = '''    const byDiscord = await queryByField(token, "recipientDiscordId", discordId, 50);
    const byRecipientId = await queryByField(token, "recipientId", discordId, 50);
    const merged = new Map();
    [...byDiscord, ...byRecipientId].forEach(item => merged.set(item.id, item));
    let items = Array.from(merged.values());
    if (!items.length && session.email) items = await queryByField(token, "recipientEmail", String(session.email), 50);'''
          if old not in s:
              raise SystemExit('notification API marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q 'initPersistentDiscordNotifications' index.html
          grep -q 'fetch('/"'"'/api/notifications'"'"'' index.html
          grep -q 'byRecipientId' api/notifications.js

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/notifications.js
          git commit -m 'Persist notification center across page navigation [skip ci]'
          git push
          git rm .github/workflows/fix-persistent-notifications.yml
          git commit -m 'Remove one-time notification persistence workflow [skip ci]'
          git push

name: Fix notification center v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch notification center
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')

          start = h.find('\nfunction startNotificationListeners(user) {')
          end = h.find('\n\nfunction mountDiscordNotificationCenter', start)
          if start < 0 or end < 0:
              raise SystemExit('notification listener block not found')

          replacement = '''
async function startNotificationListeners(user) {
    stopNotificationListeners();
    notificationUserKey = String(user?.discordId || user?.uid || user?.providerData?.[0]?.uid || "discord");
    try {
        const response = await fetch('/api/notifications', {
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.ok) {
            notificationItems = Array.isArray(data.notifications) ? data.notifications : [];
            renderNotificationCenter();
        }
    } catch (error) {
        console.error('Eroare notificări server:', error);
    }
}'''
          h = h[:start] + replacement + h[end:]

          old_auth = '''onAuthStateChanged(auth, user => {
    destroyNotificationCenter();
    const isDiscordSession = Boolean(user && !user.isAnonymous && !user.email);
    if (isDiscordSession) mountDiscordNotificationCenter(user);
});'''
          if old_auth in h:
              h = h.replace(old_auth, '', 1)

          anchor = '''function mountDiscordNotificationCenter(user) {
'''
          if anchor not in h:
              raise SystemExit('mount function not found')

          persistent = '''async function initPersistentDiscordNotificationCenter() {
    try {
        const response = await fetch('/api/me', {
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok || !data.user?.discordId) return;
        mountDiscordNotificationCenter({
            uid: String(data.user.discordId),
            discordId: String(data.user.discordId),
            providerData: [{ uid: String(data.user.discordId) }]
        });
    } catch (error) {
        console.error('Eroare sesiune Discord notificări:', error);
    }
}

'''
          if 'async function initPersistentDiscordNotificationCenter' not in h:
              h = h.replace(anchor, persistent + anchor, 1)

          marker = '''onAuthStateChanged(auth, async (user) => {'''
          if marker not in h:
              raise SystemExit('main auth listener not found')
          h = h.replace(marker, '''if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPersistentDiscordNotificationCenter, { once: true });
} else {
    initPersistentDiscordNotificationCenter();
}
window.addEventListener('pageshow', initPersistentDiscordNotificationCenter);

onAuthStateChanged(auth, async (user) => {''', 1)

          # Do not let generic Firebase transitions clear the independently managed center.
          old_destroy = '''function destroyNotificationCenter() {
    stopNotificationListeners();
    notificationUserKey = null;
    if (notificationDocumentClickHandler) {
        document.removeEventListener("click", notificationDocumentClickHandler);
        notificationDocumentClickHandler = null;
    }
    if (notificationSection) notificationSection.innerHTML = "";
}'''
          new_destroy = '''function destroyNotificationCenter() {
    clearInterval(window.pclsNotificationPoll || 0);
    stopNotificationListeners();
    notificationUserKey = null;
    if (notificationDocumentClickHandler) {
        document.removeEventListener("click", notificationDocumentClickHandler);
        notificationDocumentClickHandler = null;
    }
    if (notificationSection) notificationSection.innerHTML = "";
}'''
          if old_destroy in h:
              h = h.replace(old_destroy, new_destroy, 1)

          p.write_text(h, encoding='utf-8')

      - name: Patch notification API fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/notifications.js')
          s = p.read_text(encoding='utf-8')
          old = '''    const own = await queryByField(token, "recipientDiscordId", discordId, 50);
    let items = own;
    if (!items.length && session.email) items = await queryByField(token, "recipientEmail", String(session.email), 50);'''
          new = '''    const byDiscord = await queryByField(token, "recipientDiscordId", discordId, 50);
    const byRecipientId = await queryByField(token, "recipientId", discordId, 50);
    const merged = new Map();
    [...byDiscord, ...byRecipientId].forEach(item => merged.set(item.id, item));
    let items = Array.from(merged.values());
    if (!items.length && session.email) items = await queryByField(token, "recipientEmail", String(session.email), 50);'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q 'initPersistentDiscordNotificationCenter' index.html
          grep -q "async function startNotificationListeners" index.html
          ! grep -q 'onAuthStateChanged(auth, user => {' index.html
          grep -q 'byRecipientId' api/notifications.js

      - name: Commit and clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/notifications.js
          git commit -m 'Fix notification center persistence across navigation [skip ci]'
          git push
          git rm .github/workflows/fix-notification-center-v3.yml
          git commit -m 'Remove notification center fixer [skip ci]' || true
          git push || true

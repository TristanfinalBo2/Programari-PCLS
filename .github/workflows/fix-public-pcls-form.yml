name: Fix public PCLS form submission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace direct Firestore write with server endpoint
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pcls_page.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\s*// 1\. Salvare structurată în Firebase Firestore cu tipul "Programare"\s*'
              r'await addDoc\(collection\(db, "cereri"\), \{.*?\n\s*\}\);',
              re.S
          )

          replacement = '''
                // Salvare server-side: formularul public nu mai depinde de regulile Firestore din browser.
                const response = await fetch("/api/submit-public-request", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        nume: formData.get("NUME"),
                        numeAfacere: formData.get("NUME AFACERE"),
                        tipSpatiu: formData.get("TIP BUSSINES"),
                        tel: formData.get("NUMAR DE TEL"),
                        dataProgramare: formData.get("DATE"),
                        oraProgramare: formData.get("DATA"),
                        discordId,
                        detalii: formData.get("DETALII"),
                        website: formData.get("website") || ""
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.ok) {
                    throw new Error(result.error || `Server error (${response.status})`);
                }
'''

          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Direct Firestore submission block not found in pcls_page.html')

          p.write_text(s, encoding='utf-8')

      - name: Verify patched form
        shell: bash
        run: |
          grep -q '/api/submit-public-request' pcls_page.html
          ! grep -q 'await addDoc(collection(db, "cereri")' pcls_page.html

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pcls_page.html
          git commit -m 'Use server endpoint for public PCLS submissions [skip ci]'
          git push
          git rm .github/workflows/fix-public-pcls-form.yml
          git commit -m 'Remove one-time public PCLS form fixer [skip ci]'
          git push

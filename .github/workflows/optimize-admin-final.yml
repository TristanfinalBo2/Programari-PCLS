name: Optimize admin final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin API and UI
        shell: python
        run: |
          from pathlib import Path
          import re

          api = Path('api/admin-data.js')
          s = api.read_text(encoding='utf-8')

          if 'let cachedFirebaseToken=null,cachedFirebaseTokenExp=0;' not in s:
              s = s.replace('const VALID_ROLES=Object.keys(ROLE_PERMISSIONS);', 'const VALID_ROLES=Object.keys(ROLE_PERMISSIONS);let cachedFirebaseToken=null,cachedFirebaseTokenExp=0,cachedActorNames=new Map(),cachedRequests=null,cachedRequestsAt=0;', 1)

          s = s.replace('async function accessToken(sa){const now=Math.floor(Date.now()/1000),assertion=', 'async function accessToken(sa){if(cachedFirebaseToken&&cachedFirebaseTokenExp>Math.floor(Date.now()/1000)+60)return cachedFirebaseToken;const now=Math.floor(Date.now()/1000),assertion=', 1)
          s = s.replace('if(!r.ok||!d.access_token)throw new Error(`Google token indisponibil (${r.status}).`);return d.access_token}', 'if(!r.ok||!d.access_token)throw new Error(`Google token indisponibil (${r.status}).`);cachedFirebaseToken=d.access_token;cachedFirebaseTokenExp=Math.floor(Date.now()/1000)+3500;return cachedFirebaseToken}', 1)

          old_find='async function findProfile(token,session){const checks=[['
          if old_find in s:
              s=s.replace('async function findProfile(token,session){const checks=[["discordId",session.discordId],["discord_id",session.discordId],["discord",session.discordId],["email",session.email]];for(const[field,value]of checks){if(!value)continue;const rows=await runQuery(token,"utilizatori",field,value,1);if(rows[0])return rows[0]}return null}', 'async function findProfile(token,session){const discordId=String(session?.discordId||"").trim();const email=String(session?.email||"").trim();if(discordId){const rows=await runQuery(token,"utilizatori","discordId",discordId,1);if(rows[0])return rows[0]}if(email){const rows=await runQuery(token,"utilizatori","email",email,1);if(rows[0])return rows[0]}return null}', 1)

          s=s.replace('async function resolveActorName(token,session){const profile=await findProfile(token,session);const custom=firstValue(profile,["nume","name","displayName","numeAfisat","nume_afisat","username"]);return custom||String(session.globalName||session.username||session.name||session.email||session.discordId||"Admin PCLS")}', 'async function resolveActorName(token,session){const key=String(session?.discordId||session?.email||"");if(cachedActorNames.has(key))return cachedActorNames.get(key);const profile=await findProfile(token,session);const custom=firstValue(profile,["nume","name","displayName","numeAfisat","nume_afisat","username"]);const value=custom||String(session.globalName||session.username||session.name||session.email||session.discordId||"Admin PCLS");cachedActorNames.set(key,value);return value}', 1)

          old_get='if(req.method==="GET"){const all=await listCollection(token,"cereri"),requests=all.filter(x=>canSee(auth.role,x)).sort((a,b)=>Date.parse(String(b.created_at||b.data_creare||b.createdAt||b.data||""))-Date.parse(String(a.created_at||a.data_creare||a.createdAt||a.data||"")));'
          new_get='if(req.method==="GET"){if(cachedRequests&&Date.now()-cachedRequestsAt<2000)return json(res,200,{...cachedRequests,fromCache:true});const all=await listCollection(token,"cereri"),requests=all.filter(x=>canSee(auth.role,x)).sort((a,b)=>Date.parse(String(b.created_at||b.data_creare||b.createdAt||b.data||""))-Date.parse(String(a.created_at||a.data_creare||a.createdAt||a.data||"")));'
          if old_get in s:
              s=s.replace(old_get,new_get,1)
              s=s.replace('return json(res,200,{ok:true,user:{discordId:session.discordId,name:actor,username:session.username||actor,email:session.email||"",role:auth.role},role:auth.role,requests})}', 'const responseBody={ok:true,user:{discordId:session.discordId,name:actor,username:session.username||actor,email:session.email||"",role:auth.role},role:auth.role,requests};cachedRequests=responseBody;cachedRequestsAt=Date.now();return json(res,200,responseBody)}', 1)

          marker='await patchDoc(token,"cereri",id,updates);'
          if marker in s and 'cachedRequests=null;' not in s:
              s=s.replace(marker, marker+'cachedRequests=null;cachedRequestsAt=0;', 1)
          for marker2 in ['await patchDoc(token,"cereri",id,{arhivat:yes,archived:yes,procesat_de:`${actorLabel} (${yes?"Arhivat":"Desarhivat"})`,procesat_de_nume:actorLabel,data_procesare:now});','await deleteDoc(token,"cereri",id);']:
              if marker2 in s:
                  s=s.replace(marker2, marker2+'cachedRequests=null;cachedRequestsAt=0;',1)

          api.write_text(s,encoding='utf-8')

          p=Path('admin.html')
          h=p.read_text(encoding='utf-8')
          if 'const ADMIN_CACHE_KEY = "pcls_admin_cache_v2";' not in h:
              h=h.replace('async function initAdmin() {', 'const ADMIN_CACHE_KEY = "pcls_admin_cache_v2";\nfunction readAdminCache(){try{const raw=sessionStorage.getItem(ADMIN_CACHE_KEY);if(!raw)return null;const data=JSON.parse(raw);return data&&Array.isArray(data.requests)?data:null}catch{return null}}\nfunction writeAdminCache(data){try{sessionStorage.setItem(ADMIN_CACHE_KEY,JSON.stringify({user:data.user,role:data.role,requests:data.requests,timestamp:Date.now()}))}catch{}}\nfunction applyAdminData(data){currentUser=data.user||null;currentUserRole=data.role||data.user?.role||null;allCereri=Array.isArray(data.requests)?data.requests:[];if(currentUserRole){const generatorSection=document.getElementById("admin-generator-section");if(generatorSection)generatorSection.style.display=["superadmin","admin","conducere"].includes(currentUserRole)?"block":"none";adjustFilterButtonsForRole(currentUserRole);renderCereri();}}\nasync function initAdmin() {', 1)

          old='''async function initAdmin() {\n  try {\n    const data = await api("GET");\n    currentUser = data.user || null;\n    currentUserRole = data.role || data.user?.role || null;\n    allCereri = Array.isArray(data.requests) ? data.requests : [];\n    if (!currentUserRole) throw new Error("Rol administrator indisponibil.");\n    const generatorSection = document.getElementById("admin-generator-section");\n    if (generatorSection) generatorSection.style.display = ["superadmin","admin","conducere"].includes(currentUserRole) ? "block" : "none";\n    adjustFilterButtonsForRole(currentUserRole);\n    renderCereri();\n  } catch (error) {'''
          new='''async function initAdmin() {\n  const cached=readAdminCache();\n  if(cached){applyAdminData(cached);}\n  try {\n    const data = await api("GET");\n    applyAdminData(data);\n    writeAdminCache(data);\n  } catch (error) {'''
          if old not in h:
              raise SystemExit('initAdmin block not found')
          h=h.replace(old,new,1)

          p.write_text(h,encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q 'cachedFirebaseToken' api/admin-data.js
          grep -q 'cachedRequests' api/admin-data.js
          grep -q 'pcls_admin_cache_v2' admin.html
          grep -q 'readAdminCache' admin.html

      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/admin-data.js admin.html
          git commit -m 'Speed up admin page with session cache and server caching [skip ci]' || true
          git push || true
          git rm .github/workflows/optimize-admin-final.yml
          git commit -m 'Remove one-time admin optimization workflow [skip ci]' || true
          git push || true

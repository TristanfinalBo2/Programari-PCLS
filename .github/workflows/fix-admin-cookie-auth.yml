name: Fix Admin Cookie Auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace admin auth script with cookie/API version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'<script type="module">.*?</script>\s*</body>', re.S)
          replacement = r'''<script>
          const ROLE_PERMISSIONS = {
            superadmin: ["all"],
            admin: ["all"],
            conducere: ["isuls", "dsls", "mmls", "ssmls"],
            isuls: ["isuls"], dsls: ["dsls"], mmls: ["mmls", "mm"], ssmls: ["ssmls", "ssmmls"]
          };

          let currentUser = null;
          let currentUserRole = null;
          let allCereri = [];
          let currentFilter = "all";
          let currentSearch = "";
          let pendingDeleteId = null;
          let pendingApproveId = null;
          let currentOpenItem = null;

          const cereriContainer = document.getElementById("cereri-container");
          const totalCountEl = document.getElementById("total-count");
          const filterButtons = document.querySelectorAll(".filter-btn");
          const searchInput = document.getElementById("cereri-search");
          const searchClearBtn = document.getElementById("cereri-search-clear");
          const approveModal = document.getElementById("approve-modal");
          const approveOkBtn = document.getElementById("approve-ok-btn");
          const approveCancelBtn = document.getElementById("approve-cancel-btn");
          const approveCloseBtn = document.getElementById("approve-close");
          const approveCopyBtn = document.getElementById("approve-copy-btn");
          const confirmModal = document.getElementById("confirm-modal");
          const confirmOkBtn = document.getElementById("confirm-ok-btn");
          const confirmCancelBtn = document.getElementById("confirm-cancel-btn");
          const confirmCloseBtn = document.getElementById("confirm-close");
          const detailsModal = document.getElementById("details-modal");
          const detailsClose = document.getElementById("details-close");
          const detailsCloseBtn = document.getElementById("details-close-btn");
          const detailsTrashBtn = document.getElementById("details-trash-btn");
          const detailsCopyBtn = document.getElementById("details-copy-btn");
          const btnGenerateCode = document.getElementById("btn-generate-code");
          const inviteRoleSelect = document.getElementById("invite-role-select");
          const generatedCodeDisplay = document.getElementById("generated-code-display");

          function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]));
          }
          function normalize(value) {
            return String(value || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toLowerCase().trim();
          }
          function roleCanSee(role, item) {
            if (["superadmin", "admin"].includes(role)) return true;
            const text = [item.departament,item.departament_medical,item.department,item.dept,item.tip_cerere,item.tip,item.eveniment].filter(Boolean).join(" ").toLowerCase();
            return (ROLE_PERMISSIONS[role] || []).some(k => k !== "all" && text.includes(k));
          }
          function toastMessage(message, type="success") {
            const host = document.getElementById("toast-container");
            if (!host) return;
            const div = document.createElement("div");
            div.className = `toast ${type}`;
            div.innerHTML = `<div class="toast-icon">${type === "success" ? "✓" : type === "warning" ? "!" : "×"}</div><div class="toast-content"><div class="toast-title">${type === "success" ? "Succes" : type === "warning" ? "Atenție" : "Eroare"}</div><div class="toast-message">${escapeHtml(message)}</div></div><div class="toast-progress"></div>`;
            host.appendChild(div);
            setTimeout(() => div.remove(), 3600);
          }
          function getCurrentAdminName() { return currentUser?.email || currentUser?.name || currentUser?.discordId || "Admin PCLS"; }

          async function api(method="GET", body=null) {
            const options = { method, credentials: "same-origin", cache: "no-store", headers: {} };
            if (body) { options.headers["Content-Type"] = "application/json"; options.body = JSON.stringify(body); }
            const response = await fetch("/api/admin-data", options);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              const error = new Error(data.error || `HTTP ${response.status}`);
              error.status = response.status;
              throw error;
            }
            return data;
          }

          async function initAdmin() {
            try {
              const data = await api("GET");
              currentUser = data.user || null;
              currentUserRole = data.role || data.user?.role || null;
              allCereri = Array.isArray(data.requests) ? data.requests : [];
              if (!currentUserRole) throw new Error("Rol administrator indisponibil.");
              const generatorSection = document.getElementById("admin-generator-section");
              if (generatorSection) generatorSection.style.display = ["superadmin","admin","conducere"].includes(currentUserRole) ? "block" : "none";
              adjustFilterButtonsForRole(currentUserRole);
              renderCereri();
            } catch (error) {
              console.error("Cookie admin auth:", error);
              if (error.status === 401) return window.location.href = "auth.html";
              if (error.status === 403) return window.location.href = "index.html";
              if (cereriContainer) cereriContainer.innerHTML = `<div class="empty-state">${escapeHtml(error.message || "Nu s-au putut încărca cererile.")}</div>`;
            }
          }

          function adjustFilterButtonsForRole(role) {
            filterButtons.forEach(btn => {
              const filterVal = normalize(btn.getAttribute("data-filter") || btn.textContent);
              btn.style.display = "";
              if (["superadmin","admin"].includes(role)) return;
              if (role === "conducere") return;
              const allowed = {isuls:"isuls",dsls:"dsls",mmls:"mmls",ssmls:"ssmls"}[role];
              const departmentFilters = ["isuls","dsls","mmls","ssmls","pcls"];
              if (departmentFilters.includes(filterVal) && filterVal !== allowed) btn.style.display = "none";
            });
          }

          function renderCereri() {
            if (!cereriContainer) return;
            const visible = allCereri.filter(item => roleCanSee(currentUserRole, item));
            const activeCount = visible.filter(x => normalize(x.status) !== "in_cos" && !x.arhivat && !x.archived && !x.deleted).length;
            if (totalCountEl) totalCountEl.textContent = activeCount;
            let filtered = visible.filter(item => {
              const status = normalize(item.status || "in_asteptare");
              const trash = status === "in_cos" || item.deleted === true;
              const archived = item.arhivat === true || item.archived === true || status === "arhivat";
              const f = normalize(currentFilter);
              if (f === "in_cos") return trash;
              if (trash) return false;
              if (f === "arhivat") return archived;
              if (archived) return false;
              if (f === "all") return true;
              if (f === "in_asteptare") return status.includes("asteptare");
              if (f === "pcls") {
                const dep = normalize(item.departament);
                if (["isuls","dsls","mmls","mm","ssmls","ssmmls"].includes(dep)) return false;
                const text = normalize([item.tip_cerere,item.tip,item.categorie,item.eveniment].filter(Boolean).join(" "));
                return dep === "pcls" || text.includes("eveniment") || text.includes("programare") || text.includes("inregistrare");
              }
              return normalize(item.departament) === f;
            });
            if (currentSearch) {
              const q = normalize(currentSearch);
              filtered = filtered.filter(item => normalize([item.nume_proprietar,item.proprietar,item.reprezentant,item.nume,item.nume_afacere,item.unitate,item.denumire_afacere,item.business_name].filter(Boolean).join(" ")).includes(q));
            }
            cereriContainer.innerHTML = "";
            if (!filtered.length) {
              cereriContainer.innerHTML = `<div class="empty-state">${currentSearch ? "Nu am găsit rezultate pentru căutarea ta." : "Nu există cereri vizibile pentru filtrul selectat."}</div>`;
              return;
            }
            filtered.forEach(item => {
              const tip = item.eveniment || item.tip_cerere || item.tip || "PROGRAMARE";
              const status = item.status || "in_asteptare";
              const raw = normalize(status);
              const badgeClass = normalize(tip).includes("eveniment") ? "eveniment" : "programare";
              const nume = escapeHtml(item.nume_proprietar || item.proprietar || item.reprezentant || item.nume || "-");
              const afacere = escapeHtml(item.nume_afacere || item.unitate || "-");
              const data = escapeHtml(item.data_ora || (item.dataProgramare ? `${item.dataProgramare} la ${item.oraProgramare || ""}` : "-"));
              let actions = "";
              if (raw === "in_cos" || item.deleted === true) actions = `<button class="btn-action btn-restore" data-id="${item.id}">Restaurează</button><button class="btn-action btn-trash" data-id="${item.id}">Șterge Definitiv</button>`;
              else if (item.arhivat === true || item.archived === true || raw === "arhivat") actions = `<button class="btn-action btn-unarchive" data-id="${item.id}">Desarhivează</button><button class="btn-action btn-trash" data-id="${item.id}">Șterge</button>`;
              else actions = `<button class="btn-action btn-details" data-id="${item.id}">Detalii</button><button class="btn-action btn-approve" data-id="${item.id}">Acceptă</button><button class="btn-action btn-reject" data-id="${item.id}">Respinge</button><button class="btn-action btn-archive" data-id="${item.id}">Arhivă</button><button class="btn-action btn-trash" data-id="${item.id}">Șterge</button>`;
              const card = document.createElement("div");
              card.className = "card";
              card.innerHTML = `<div class="card-header"><span class="type-badge ${badgeClass}">${escapeHtml(tip)}</span><span class="status-badge ${raw.includes("aprobat") ? "aprobat" : raw.includes("respins") ? "respins" : raw === "in_cos" ? "in_cos" : "in_asteptare"}">${escapeHtml(String(status).replace("_"," "))}</span></div><div class="card-body"><p><strong>Nume</strong><span>${nume}</span></p><p><strong>Afacere / Tip</strong><span>${afacere}</span></p><p><strong>Data & Ora</strong><span>${data}</span></p></div><div class="card-actions">${actions}</div>`;
              cereriContainer.appendChild(card);
            });
            attachActionListeners();
          }

          function attachActionListeners() {
            document.querySelectorAll(".btn-details").forEach(btn => btn.onclick = () => openDetailsModal(allCereri.find(x=>x.id===btn.dataset.id)));
            document.querySelectorAll(".btn-approve").forEach(btn => btn.onclick = () => openApproveModal(btn.dataset.id));
            document.querySelectorAll(".btn-reject").forEach(btn => btn.onclick = () => updateStatus(btn.dataset.id,"respins","Respins cererea"));
            document.querySelectorAll(".btn-archive").forEach(btn => btn.onclick = () => toggleArchive(btn.dataset.id,true));
            document.querySelectorAll(".btn-unarchive").forEach(btn => btn.onclick = () => toggleArchive(btn.dataset.id,false));
            document.querySelectorAll(".btn-restore").forEach(btn => btn.onclick = () => updateStatus(btn.dataset.id,"În Așteptare","Restaurat cererea"));
            document.querySelectorAll(".btn-trash").forEach(btn => btn.onclick = async () => {
              const id=btn.dataset.id, item=allCereri.find(x=>x.id===id);
              if (item && (item.status === "in_cos" || item.deleted === true)) { pendingDeleteId=id; confirmModal.classList.add("active"); }
              else { await updateStatus(id,"in_cos","Mutat în Coș"); }
            });
          }

          function openApproveModal(id) {
            const item=allCereri.find(x=>x.id===id); if(!item) return;
            pendingApproveId=id;
            document.getElementById("app-nume").textContent=item.nume_proprietar||item.proprietar||item.reprezentant||item.nume||"-";
            document.getElementById("app-adresa").textContent=item.adresa||item.locatie||item.detalii||"-";
            document.getElementById("app-tip").textContent=(item.eveniment||item.tip_cerere||item.tip||"PROGRAMARE").toUpperCase();
            document.getElementById("app-data").textContent=item.data_ora||(item.dataProgramare?`${item.dataProgramare} la ${item.oraProgramare||""}`:(item.dataDorita?`${item.dataDorita} la ${item.oraDorita||""}`:"-"));
            document.getElementById("app-admin").textContent=`@${getCurrentAdminName().split('@')[0]}`;
            approveModal.classList.add("active");
          }
          function openDetailsModal(item) {
            if(!item) return;
            currentOpenItem=item;
            document.getElementById("details-code-tag").textContent=item.codEveniment||item.cod_eveniment||item.cod||"PCLS-CERERE";
            const userAction=item.procesat_de?`${item.procesat_de} pe ${item.data_procesare||"-"}`:"Nicio acțiune";
            const fields=[
              {label:"Departament",value:(item.departament||"ISULS").toUpperCase(),size:"third"},{label:"Status Curent",value:item.status||"În Așteptare",size:"third"},{label:"Data & Ora",value:item.data_ora||item.dataProgramare||"-",size:"third"},{label:"Procesată de User",value:userAction,highlight:true,full:true},{label:"Proprietar / Reprezentant",value:item.nume_proprietar||item.proprietar||item.nume||"-",size:"half"},{label:"Telefon Contact",value:item.telefon||item.tel||"-",size:"half"},{label:"Nume Afacere",value:item.nume_afacere||item.unitate||"-",size:"half"},{label:"Tip Business",value:item.tip_afacere||item.tipSpatiu||"-",size:"half"},{label:"Detalii Extra / Locație",value:item.detalii||item.adresa||"-",full:true}
            ];
            document.getElementById("details-container").innerHTML=fields.map(f=>`<div class="details-item ${f.full?"full-width":""} ${f.size==="half"?"half-width":""} ${f.size==="third"?"third-width":""} ${f.highlight?"highlight-user":""}"><label>${f.label}</label><span>${escapeHtml(f.value)}</span></div>`).join("");
            detailsTrashBtn.textContent=(item.status==="in_cos"||item.deleted===true)?"Șterge Definitiv":"Mută în Coș";
            detailsModal.classList.add("active");
          }
          async function postAction(body) {
            try { const r=await api("POST",body); await loadData(); return r; }
            catch(e){ if(e.status===401) location.href="auth.html"; else toastMessage(e.message||"Eroare la operație","error"); throw e; }
          }
          async function loadData() { const data=await api("GET"); currentUser=data.user; currentUserRole=data.role||data.user?.role; allCereri=Array.isArray(data.requests)?data.requests:[]; renderCereri(); }
          async function updateStatus(id,status,actionName){ try{await postAction({action:"status",id,status,actionName});toastMessage(status==="aprobat"?"Cererea a fost aprobată.":status==="respins"?"Cererea a fost respinsă.":"Cererea a fost actualizată.",status==="respins"?"warning":"success");}catch{} }
          async function toggleArchive(id,value){try{await postAction({action:"archive",id,value});toastMessage(value?"Cererea a fost arhivată.":"Cererea a fost desarhivată.","success");}catch{}}

          approveCloseBtn?.addEventListener("click",()=>approveModal.classList.remove("active"));
          approveCancelBtn?.addEventListener("click",()=>approveModal.classList.remove("active"));
          approveOkBtn?.addEventListener("click",async()=>{if(!pendingApproveId)return;await updateStatus(pendingApproveId,"aprobat","Aprobat cererea");pendingApproveId=null;approveModal.classList.remove("active");});
          approveCopyBtn?.addEventListener("click",()=>{const t=`=== CONFIRMARE APROBARE ===\\nNume / Reprezentant: ${document.getElementById("app-nume").textContent}\\nAdresă / Locație: ${document.getElementById("app-adresa").textContent}\\nTip Control / Cerere: ${document.getElementById("app-tip").textContent}\\nData & Ora: ${document.getElementById("app-data").textContent}\\nProcesat și Acceptat de: ${document.getElementById("app-admin").textContent}`;navigator.clipboard.writeText(t).then(()=>toastMessage("Datele au fost copiate.","success"));});
          confirmCancelBtn?.addEventListener("click",()=>{pendingDeleteId=null;confirmModal.classList.remove("active")});
          confirmCloseBtn?.addEventListener("click",()=>{pendingDeleteId=null;confirmModal.classList.remove("active")});
          confirmOkBtn?.addEventListener("click",async()=>{if(!pendingDeleteId)return;try{await postAction({action:"delete",id:pendingDeleteId});toastMessage("Cererea a fost ștearsă definitiv.","warning");}catch{}pendingDeleteId=null;confirmModal.classList.remove("active")});
          detailsClose?.addEventListener("click",()=>detailsModal.classList.remove("active"));
          detailsCloseBtn?.addEventListener("click",()=>detailsModal.classList.remove("active"));
          detailsTrashBtn?.addEventListener("click",async()=>{if(!currentOpenItem)return;const id=currentOpenItem.id;if(currentOpenItem.status==="in_cos"||currentOpenItem.deleted===true){pendingDeleteId=id;detailsModal.classList.remove("active");confirmModal.classList.add("active");}else{await updateStatus(id,"in_cos","Mutat în Coș din Detalii");detailsModal.classList.remove("active");}});
          detailsCopyBtn?.addEventListener("click",()=>{const items=document.querySelectorAll("#details-container .details-item");let t=`=== DETALII CERERE: ${document.getElementById("details-code-tag").textContent} ===\\n\\n`;items.forEach(x=>t+=`${x.querySelector("label").textContent}: ${x.querySelector("span").textContent}\\n`);navigator.clipboard.writeText(t).then(()=>toastMessage("Detaliile au fost copiate.","success"));});
          filterButtons.forEach(btn=>btn.addEventListener("click",()=>{filterButtons.forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentFilter=btn.dataset.filter||"all";renderCereri();}));
          searchInput?.addEventListener("input",()=>{currentSearch=searchInput.value;searchClearBtn.hidden=!currentSearch;renderCereri();});
          searchClearBtn?.addEventListener("click",()=>{currentSearch="";searchInput.value="";searchClearBtn.hidden=true;searchInput.focus();renderCereri();});
          btnGenerateCode?.addEventListener("click",async()=>{try{btnGenerateCode.disabled=true;const data=await postAction({action:"generateInvite",role:inviteRoleSelect?.value||"isuls"});if(generatedCodeDisplay)generatedCodeDisplay.innerHTML=`Cod generat: <span style="background:rgba(0,255,163,.1);padding:4px 10px;border-radius:8px;user-select:all;border:1px solid rgba(0,255,163,.2);">${escapeHtml(data.code)}</span>`;toastMessage("Cod generat și salvat cu succes.","success");}catch{}finally{btnGenerateCode.disabled=false;}});

          initAdmin();
          setInterval(()=>{if(document.visibilityState==="visible" && currentUserRole) loadData().catch(()=>{});},15000);
          </script></body>'''
          out, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('admin.html script block not found')
          p.write_text(out, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use Discord cookie session for admin panel [skip ci]"
          git push
          rm -f .github/workflows/fix-admin-cookie-auth.yml
          git add -u .github/workflows/fix-admin-cookie-auth.yml
          git commit -m "Remove one-time admin cookie auth workflow [skip ci]"
          git push

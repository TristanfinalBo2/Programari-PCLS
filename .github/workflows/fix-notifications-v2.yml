name: Fix notification center v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')

          old_start = '''function startNotificationListeners(user) {
    stopNotificationListeners();
    notificationUserKey = user.uid;

    // Exact aceeași identificare folosită de pagina Cererile Mele.
    const accountIdentifier = user.providerData?.[0]?.uid || user.uid;
    const definitions = [
        { source: "discord", field: "discord" },
        { source: "discord_id", field: "discord_id" }
    ];

    definitions.forEach(definition => {
        const qNotifications = query(collection(db, "cereri"), where(definition.field, "==", accountIdentifier));
        const unsubscribe = onSnapshot(qNotifications, snapshot => {
            const source = new Map();
            snapshot.forEach(docSnap => source.set(docSnap.id, { id: docSnap.id, ...docSnap.data() }));
            notificationRequestsBySource[definition.source] = source;
            mergeNotificationRequests();
        }, error => {
            console.error(`Eroare notificări (${definition.field}):`, error);
        });
        notificationUnsubscribers.push(unsubscribe);
    });
}'''

          new_start = '''async function startNotificationListeners(user) {
    stopNotificationListeners();
    notificationUserKey = String(user?.discordId || user?.uid || user?.providerData?.[0]?.uid || "discord");
    try {
        const response = await fetch('/api/notifications', {
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.ok) {
            notificationItems = Array.isArray(data.notifications) ? data.notifications : [];
            renderNotificationCenter();
        }
    } catch (error) {
        console.error('Eroare notificări server:', error);
    }
    clearInterval(window.pclsNotificationPoll || 0);
    window.pclsNotificationPoll = setInterval(() => {
        if (document.visibilityState === 'visible') startNotificationListeners(user);
    }, 15000);
}'''

          if old_start not in h:
              raise SystemExit('old notification listener block not found')
          h = h.replace(old_start, new_start, 1)

          old_auth = '''onAuthStateChanged(auth, user => {
    destroyNotificationCenter();
    const isDiscordSession = Boolean(user && !user.isAnonymous && !user.email);
    if (isDiscordSession) mountDiscordNotificationCenter(user);
});'''

          new_auth = '''// Notificările sunt controlate de sesiunea Discord din cookie.
// Nu le ștergem când Firebase Auth își schimbă starea.
'''

          if old_auth not in h:
              raise SystemExit('old notification auth block not found')
          h = h.replace(old_auth, new_auth, 1)

          p.write_text(h, encoding='utf-8')

      - name: Patch notification API
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/notifications.js')
          s = p.read_text(encoding='utf-8')
          old = '''    const own = await queryByField(token, "recipientDiscordId", discordId, 50);
    let items = own;
    if (!items.length && session.email) items = await queryByField(token, "recipientEmail", String(session.email), 50);'''
          new = '''    const byDiscord = await queryByField(token, "recipientDiscordId", discordId, 50);
    const byRecipientId = await queryByField(token, "recipientId", discordId, 50);
    const merged = new Map();
    [...byDiscord, ...byRecipientId].forEach(item => merged.set(item.id, item));
    let items = Array.from(merged.values());
    if (!items.length && session.email) items = await queryByField(token, "recipientEmail", String(session.email), 50);'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q "async function startNotificationListeners" index.html
          ! grep -q "onAuthStateChanged(auth, user => {" index.html
          grep -q "byRecipientId" api/notifications.js

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/notifications.js
          git commit -m 'Fix notification center persistence across navigation [skip ci]'
          git push
          git rm .github/workflows/fix-notifications-v2.yml
          git commit -m 'Remove notification fixer workflow [skip ci]'
          git push || true

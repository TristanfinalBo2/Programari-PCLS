name: Apply Discord Cookie Auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cookie auth migration
        run: python3 scripts/apply-discord-cookie-auth.py

      - name: Commit migrated auth files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/discord-auth.js api/my-requests.js auth.html cererile_mele.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Migrate Discord login to secure server cookie auth [skip ci]"
          git push origin HEAD:main

      - name: Remove migration workflow
        if: success()
        run: |
          git rm .github/workflows/apply-discord-cookie-auth.yml
          git commit -m "Remove one-time Discord cookie auth migration workflow [skip ci]"
          git push origin HEAD:main

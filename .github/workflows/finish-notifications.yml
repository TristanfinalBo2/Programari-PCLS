name: Ensure notification delivery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Discord ID sufficient for notification delivery
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/admin-data.js')
          s = p.read_text(encoding='utf-8')
          old = 'if(!recipientId){const ownerProfile=await findProfile(token,{discordId,email:firstValue(item,["email","emailAddress"])});recipientId=ownerProfile?.id||""}if(!recipientId)return;'
          new = 'if(!recipientId){const ownerProfile=await findProfile(token,{discordId,email:firstValue(item,["email","emailAddress"])});recipientId=ownerProfile?.id||discordId||""}if(!recipientId)return;'
          if old not in s: raise SystemExit('notification recipient marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q 'recipientId=ownerProfile?.id||discordId||""' api/admin-data.js
          grep -q "fetch('/api/notifications'" index.html

      - name: Commit and clean workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/admin-data.js
          git commit -m 'Ensure status notifications resolve by Discord ID [skip ci]'
          git push
          git rm .github/workflows/finish-notifications.yml
          git commit -m 'Remove one-time notification delivery fixer [skip ci]'
          git push

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Audit Log | Portal PCLS</title>
<style>
:root{color-scheme:dark;--bg:#05070c;--panel:rgba(18,25,40,.64);--line:rgba(255,255,255,.1);--text:#f7f9ff;--muted:#b8c0d0;--quiet:#7f8aa0;--accent:#64d2ff;--mint:#63e6be;--danger:#ff6961;--gold:#ffd60a;--violet:#bf5af2}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding:30px 16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,rgba(10,132,255,.2),transparent 30%),radial-gradient(circle at 88% 8%,rgba(191,90,242,.14),transparent 28%),linear-gradient(145deg,#070b14,#05070c)}
a{color:inherit;text-decoration:none}.page{width:min(1100px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.kicker{color:var(--accent);font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.title{margin-top:6px;font-size:clamp(2rem,5vw,2.8rem);font-weight:800;letter-spacing:-.045em}.sub{margin-top:8px;color:var(--muted);font-size:.86rem}.actions{display:flex;gap:8px}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:var(--text);font-weight:700;cursor:pointer}.btn:hover{background:rgba(255,255,255,.09)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:16px}.input,.select{height:44px;width:100%;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:var(--text);outline:none}.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(18,25,40,.62),rgba(10,15,27,.45));overflow:hidden}.row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;padding:15px 17px;border-bottom:1px solid rgba(255,255,255,.06);align-items:start}.row:last-child{border-bottom:0}.time{color:var(--quiet);font-size:.7rem;line-height:1.4}.event strong{display:block;font-size:.82rem}.event span{display:block;margin-top:4px;color:var(--muted);font-size:.75rem;line-height:1.45}.tag{padding:5px 8px;border-radius:999px;background:rgba(100,210,255,.08);border:1px solid rgba(100,210,255,.16);color:#dff6ff;font-size:.61rem;font-weight:800;text-transform:uppercase;white-space:nowrap}.empty{padding:50px 20px;text-align:center;color:var(--quiet)}@media(max-width:760px){.head{align-items:flex-start;flex-direction:column}.actions,.btn{width:100%}.toolbar{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:6px}.tag{justify-self:start}}
</style>
</head>
<body><main class="page"><header class="head"><div><div class="kicker">Securitate · Administrare</div><div class="title">Audit Log</div><div class="sub">Istoricul acțiunilor importante din portal.</div></div><div class="actions"><a class="btn" href="admin.html">← Admin</a><button class="btn" id="refresh" type="button">Actualizează</button></div></header><section class="toolbar"><input id="search" class="input" type="search" placeholder="Caută actor, acțiune, utilizator sau ID..."><select id="type" class="select"><option value="all">Toate</option><option value="cerere">Cereri</option><option value="utilizator">Utilizatori</option></select><select id="role" class="select"><option value="all">Toate rolurile</option><option value="superadmin">Superadmin</option><option value="admin">Admin</option><option value="conducere">Conducere</option></select></section><section class="panel"><div id="list" class="empty">Se verifică accesul…</div></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {collection,onSnapshot,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const list=document.getElementById("list"), search=document.getElementById("search"), type=document.getElementById("type"), role=document.getElementById("role"); let events=[];
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function render(){const s=String(search.value||"").toLowerCase().trim(),t=type.value,r=role.value;const filtered=events.filter(e=>{const hay=[e.actorName,e.actorRole,e.action,e.targetName,e.targetId,e.targetType,e.department].filter(Boolean).join(" ").toLowerCase();return(!s||hay.includes(s))&&(t==="all"||e.targetType===t)&&(r==="all"||String(e.actorRole||"").toLowerCase()===r)});if(!filtered.length){list.innerHTML='<div class="empty">Nu există evenimente pentru filtrul selectat.</div>';return}list.innerHTML=filtered.map(e=>{const d=e.createdAt?.toDate?e.createdAt.toDate():new Date(e.createdAt||0);const tm=Number.isNaN(d.getTime())?"—":d.toLocaleString("ro-RO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});return `<div class="row"><div class="time">${esc(tm)}</div><div class="event"><strong>${esc(e.actorName||"Sistem")}</strong><span>${esc(e.action||"Activitate")} · ${esc(e.targetName||e.targetId||"—")}</span></div><span class="tag">${esc(e.targetType||"sistem")}</span></div>`}).join("")}
function start(){onSnapshot(query(collection(db,"audit_log"),orderBy("createdAt","desc"),limit(200)),snap=>{events=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>{console.error(err);list.innerHTML='<div class="empty">Nu s-a putut încărca Audit Log. Verifică regulile Firestore pentru audit_log.</div>'})}
search.oninput=render;type.onchange=render;role.onchange=render;document.getElementById("refresh").onclick=()=>render();onAuthStateChanged(auth,async u=>{if(!u){location.href="auth.html";return}start()});
</script></body></html>
